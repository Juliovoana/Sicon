<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Vitrine de parceiros</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' rx='46' fill='%231B4332'/%3E%3Ccircle cx='72' cy='72' r='24' fill='%23F0F4EE'/%3E%3Ccircle cx='132' cy='72' r='24' fill='%23F2A93B'/%3E%3Cpath d='M26 158c4-32 24-46 46-46s42 14 46 46zM86 158c4-32 24-46 46-46s42 14 46 46z' fill='%23F0F4EE' opacity='.92'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --brand:#1B4332; --brand-2:#2D6A4F; --brand-escuro:#0F2B22; --accent:#F2A93B; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ height:100%; overflow:hidden; background:#000; color:#fff; font-family:'Inter', -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
  body.sem-cursor, body.sem-cursor *{ cursor:none !important; }

  #palco{ position:fixed; inset:0; }
  .slide{ position:absolute; inset:0; opacity:0; transition:opacity .9s ease; z-index:1; }
  .slide.visivel{ opacity:1; z-index:2; }
  .slide > div{ position:relative; width:100%; height:100%; }

  /* ---------- slide de parceiro ---------- */
  .s-parceiro{ display:flex; align-items:center; gap:5vw; padding:5vh 5vw 12vh; background:linear-gradient(135deg, var(--brand) 0%, var(--brand-escuro) 100%); }
  .s-parceiro::after{ content:""; position:absolute; inset:0; background:radial-gradient(circle at 85% 10%, rgba(242,169,59,.22), transparent 55%); pointer-events:none; }
  .s-esq{ flex:0 0 40%; height:100%; display:flex; align-items:center; justify-content:center; position:relative; z-index:1; }
  .cartao-moldura{ background:#fff; padding:1.2vmin; border-radius:2vmin; box-shadow:0 3vmin 8vmin rgba(0,0,0,.45); max-width:100%; max-height:100%; }
  .cartao-moldura img{ display:block; max-width:100%; max-height:62vh; border-radius:1vmin; }
  .avatar-grande{ width:38vmin; height:38vmin; border-radius:50%; background:rgba(255,255,255,.14); border:.6vmin solid rgba(255,255,255,.3); display:flex; align-items:center; justify-content:center; font-size:13vmin; font-weight:800; }
  .s-dir{ flex:1; min-width:0; position:relative; z-index:1; }
  .tag-ramo{ display:inline-block; background:var(--accent); color:#2b1d00; font-weight:800; font-size:2.5vmin; padding:.9vmin 2.4vmin; border-radius:5vmin; text-transform:uppercase; letter-spacing:.06em; margin-bottom:2.2vmin; }
  .nome{ font-size:7.4vmin; line-height:1.05; font-weight:800; letter-spacing:-.02em; overflow-wrap:anywhere; }
  .empresa{ font-size:3.8vmin; opacity:.92; margin-top:1.2vmin; font-weight:600; }
  .cidade{ font-size:2.8vmin; opacity:.85; margin-top:1.4vmin; }
  .espec{ font-size:3.1vmin; font-weight:600; margin-top:3vmin; line-height:1.3; }
  .desc{ font-size:2.6vmin; opacity:.85; margin-top:1.6vmin; line-height:1.4; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .contato{ display:flex; align-items:center; gap:3vmin; margin-top:4vmin; background:rgba(0,0,0,.3); border-radius:2vmin; padding:2.2vmin 3vmin; width:fit-content; max-width:100%; }
  .contato span{ display:block; font-size:2.2vmin; opacity:.85; margin-bottom:.4vmin; }
  .contato strong{ font-size:5.2vmin; font-weight:800; letter-spacing:.01em; white-space:nowrap; }
  .qr{ background:#fff; padding:1vmin; border-radius:1.2vmin; line-height:0; flex-shrink:0; }
  .qr canvas, .qr img{ width:14vmin !important; height:14vmin !important; }

  /* ---------- slide de propaganda ---------- */
  .s-ad{ background:#000; display:flex; align-items:center; justify-content:center; padding-bottom:7vh; overflow:hidden; }
  .ad-fundo{ position:absolute; inset:-5%; background-size:cover; background-position:center; filter:blur(3.5vmin) brightness(.5); }
  .ad-img{ position:relative; z-index:1; max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; }
  .ad-legenda{ position:absolute; left:0; right:0; bottom:7vh; z-index:2; padding:6vh 5vw 3vh; background:linear-gradient(0deg, rgba(0,0,0,.78), rgba(0,0,0,0)); font-size:4.2vmin; font-weight:700; line-height:1.25; text-align:center; text-shadow:0 .3vmin 1.2vmin rgba(0,0,0,.6); }
  .ad-texto{ width:100%; height:100%; padding:8vh 8vw 14vh; display:flex; flex-direction:column; justify-content:center; text-align:center; background:linear-gradient(135deg, var(--brand-2), var(--brand-escuro)); position:relative; z-index:1; }
  .ad-texto h1{ font-size:9vmin; font-weight:800; line-height:1.1; }
  .ad-texto p{ font-size:4.2vmin; margin-top:3vmin; opacity:.92; line-height:1.35; }

  /* ---------- rodapé, progresso e controles ---------- */
  #rodape{ position:fixed; left:0; right:0; bottom:.9vh; height:6.4vh; z-index:6; background:rgba(0,0,0,.5); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:space-between; gap:2vw; padding:0 3vw; font-size:2.3vmin; }
  #rodape .marca{ display:flex; align-items:center; gap:1.4vmin; font-weight:700; min-width:0; }
  #rodape .marca img{ height:4.4vh; border-radius:.8vmin; }
  #rodape .convite{ opacity:.9; text-align:right; }
  #progresso{ position:fixed; left:0; right:0; bottom:0; height:.9vh; z-index:7; background:rgba(255,255,255,.18); }
  #progressoBarra{ height:100%; width:0; background:var(--accent); }
  @keyframes encher{ from{ width:0; } to{ width:100%; } }

  #controles{ position:fixed; top:2vh; right:2vw; z-index:9; display:flex; gap:1vmin; opacity:0; transition:opacity .3s; }
  #controles.mostrando{ opacity:1; }
  #controles button{ width:6vmin; height:6vmin; min-width:38px; min-height:38px; border-radius:50%; border:none; background:rgba(0,0,0,.55); color:#fff; font-size:2.6vmin; cursor:pointer; backdrop-filter:blur(4px); }
  #controles button:hover{ background:rgba(0,0,0,.8); }

  #mensagem{ position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; text-align:center; padding:6vmin; background:linear-gradient(135deg, var(--brand), var(--brand-escuro)); }
  #mensagem.show{ display:flex; }
  #mensagem .icone{ font-size:9vmin; margin-bottom:2vmin; }
  #mensagem h2{ font-size:5vmin; font-weight:800; margin-bottom:1.6vmin; }
  #mensagem p{ font-size:2.8vmin; opacity:.88; max-width:70vmin; line-height:1.4; }
  #dica{ position:fixed; left:50%; bottom:9vh; transform:translateX(-50%); z-index:10; background:rgba(0,0,0,.7); padding:1.4vmin 3vmin; border-radius:5vmin; font-size:2.2vmin; opacity:0; transition:opacity .5s; pointer-events:none; }
  #dica.show{ opacity:1; }

  @media (max-aspect-ratio: 1/1){
    .s-parceiro{ flex-direction:column; justify-content:center; padding:4vh 6vw 12vh; gap:3vh; }
    .s-esq{ flex:0 0 auto; height:auto; max-height:36vh; }
    .cartao-moldura img{ max-height:32vh; }
    .avatar-grande{ width:24vh; height:24vh; font-size:8vh; }
    .s-dir{ flex:0 0 auto; width:100%; text-align:center; }
    .contato{ margin-left:auto; margin-right:auto; }
  }
  @media (prefers-reduced-motion: reduce){ .slide{ transition:none; } }
</style>
</head>
<body>
  <div id="palco"><div class="slide" id="slideA"></div><div class="slide" id="slideB"></div></div>
  <div id="rodape"><div class="marca" id="rodapeMarca"></div><div class="convite" id="rodapeConvite"></div></div>
  <div id="progresso"><div id="progressoBarra"></div></div>
  <div id="controles">
    <button id="btnAnterior" title="Anterior (←)">⏮</button>
    <button id="btnPausa" title="Pausar / continuar (espaço)">⏸</button>
    <button id="btnProximo" title="Próximo (→)">⏭</button>
    <button id="btnTelaCheia" title="Tela cheia (F)">⛶</button>
  </div>
  <div id="dica">Pressione F ou dê dois cliques para tela cheia</div>
  <div id="mensagem" class="show"><div><div class="icone">⏳</div><h2>Carregando…</h2></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://frzvcrcshkpvjdbbqkhz.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_h-JuDyjYgb5YKGYFRKtLEg_8gnJor9w';
  const BUCKET_CARTOES = 'parceiros-cartoes';
  const BUCKET_PROPAGANDAS = 'parceiros-propagandas';
  const RECARGA_MS = 5 * 60 * 1000;     // dados novos no começo da 1ª rodada depois desse intervalo
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });
  const token = new URLSearchParams(window.location.search).get('t');
  const $ = (id) => document.getElementById(id);

  let dados = null, rodada = [], idx = -1, adCursor = 0, camada = 0;
  let pausado = false, timer = null, inicioSlide = 0, restante = 0, ultimaCarga = 0, qrPronto = null;
  const camadas = [$('slideA'), $('slideB')];

  function escapeHtml(t){ const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
  function formatarFone(s){
    const d = String(s || '').replace(/\D/g, '');
    if(d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
    if(d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
    return s || '';
  }
  function linkWhatsApp(tel){
    let d = String(tel || '').replace(/\D/g, '');
    if(d.length < 10) return null;
    if(d.length <= 11) d = '55' + d;
    return `https://wa.me/${d}`;
  }
  function iniciais(nome){ const p = String(nome || '?').trim().split(/\s+/); return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); }
  function embaralhar(arr){ for(let i = arr.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
  const urlPublica = (bucket, path) => path ? sb.storage.from(bucket).getPublicUrl(path).data.publicUrl : '';
  const cssUrl = (u) => String(u).replace(/['"()\\]/g, (c) => encodeURIComponent(c));

  // ---- personalização da unidade ----
  function clarearCor(hex, p){ hex = (hex || '').replace('#', ''); if(hex.length !== 6) return hex; const c = [0, 2, 4].map(i => parseInt(hex.substr(i, 2), 16)); return '#' + c.map(v => Math.round(v + (255 - v) * p).toString(16).padStart(2, '0')).join(''); }
  function escurecerCor(hex, p){ hex = (hex || '').replace('#', ''); if(hex.length !== 6) return hex; const c = [0, 2, 4].map(i => parseInt(hex.substr(i, 2), 16)); return '#' + c.map(v => Math.round(v * (1 - p)).toString(16).padStart(2, '0')).join(''); }
  function aplicarUnidade(u){
    if(!u) return;
    if(/^#[0-9a-fA-F]{6}$/.test(u.cor_principal || '')){
      const r = document.documentElement.style;
      r.setProperty('--brand', u.cor_principal); r.setProperty('--brand-2', clarearCor(u.cor_principal, 0.2)); r.setProperty('--brand-escuro', escurecerCor(u.cor_principal, 0.45));
    }
    document.title = `Vitrine de parceiros — ${u.nome || ''}`;
    const logo = u.logo_url && /^https:\/\//.test(u.logo_url) ? `<img src="${escapeHtml(u.logo_url)}" alt="">` : '';
    $('rodapeMarca').innerHTML = `${logo}<span>${escapeHtml(u.nome || '')}</span>`;
    $('rodapeConvite').textContent = 'Seja nosso parceiro — peça seu cadastro no balcão';
  }

  function mostrarMensagem(icone, titulo, texto){
    $('mensagem').innerHTML = `<div><div class="icone">${icone}</div><h2>${escapeHtml(titulo)}</h2>${texto ? `<p>${escapeHtml(texto)}</p>` : ''}</div>`;
    $('mensagem').classList.add('show');
  }
  const esconderMensagem = () => $('mensagem').classList.remove('show');

  // ---- dados ----
  async function buscarDados(){
    const { data, error } = await sb.rpc('parceiros_vitrine', { p_token: token });
    if(error) return { erro: 'rede' };
    if(!data || !data.ok) return { erro: 'invalido' };
    return { dados: data };
  }

  // monta a fila de uma rodada: parceiros (embaralhados ou em ordem alfabética) com 1 propaganda a cada N
  function montarRodada(){
    const cfg = dados.config || {};
    const ads = dados.propagandas || [];
    let ps = [...(dados.parceiros || [])];
    if(cfg.aleatoria) embaralhar(ps);
    const lista = [];
    const itemAd = (a) => ({ tipo: 'ad', dado: a, segundos: Math.max(3, Number(a.segundos) || cfg.segundos_padrao || 10) });
    if(!ps.length){ ads.forEach(a => lista.push(itemAd(a))); return lista; }
    const n = Number(cfg.intercalar) || 0;
    ps.forEach((p, i) => {
      lista.push({ tipo: 'parceiro', dado: p, segundos: Math.max(3, Number(p.segundos) || cfg.segundos_padrao || 10) });
      if(ads.length && n > 0 && (i + 1) % n === 0){ lista.push(itemAd(ads[adCursor % ads.length])); adCursor++; }
    });
    // poucos parceiros (menos que N): garante ao menos 1 propaganda por rodada
    if(ads.length && n > 0 && ps.length < n){ lista.push(itemAd(ads[adCursor % ads.length])); adCursor++; }
    return lista;
  }

  // ---- renderização dos slides ----
  function htmlParceiro(p){
    const foto = urlPublica(BUCKET_CARTOES, p.cartao_path);
    const esq = foto
      ? `<div class="cartao-moldura"><img src="${escapeHtml(foto)}" alt=""></div>`
      : `<div class="avatar-grande">${escapeHtml(iniciais(p.nome))}</div>`;
    const wa = linkWhatsApp(p.contato);
    return `<div class="s-parceiro">
      <div class="s-esq">${esq}</div>
      <div class="s-dir">
        ${p.ramo ? `<div class="tag-ramo">${escapeHtml(p.ramo)}</div>` : ''}
        <div class="nome">${escapeHtml(p.nome)}</div>
        ${p.empresa ? `<div class="empresa">${escapeHtml(p.empresa)}</div>` : ''}
        ${p.cidade ? `<div class="cidade">📍 ${escapeHtml(p.cidade)}</div>` : ''}
        ${p.especialidades ? `<div class="espec">${escapeHtml(p.especialidades)}</div>` : ''}
        ${p.descricao ? `<div class="desc">${escapeHtml(p.descricao)}</div>` : ''}
        ${p.contato ? `<div class="contato"><div><span>Fale pelo WhatsApp</span><strong>${escapeHtml(formatarFone(p.contato))}</strong></div>${wa ? `<div class="qr" data-qr="${escapeHtml(wa)}"></div>` : ''}</div>` : ''}
      </div></div>`;
  }
  function htmlPropaganda(a){
    const img = urlPublica(BUCKET_PROPAGANDAS, a.imagem_path);
    if(!img){
      return `<div class="s-ad"><div class="ad-texto"><h1>${escapeHtml(a.titulo)}</h1>${a.texto ? `<p>${escapeHtml(a.texto)}</p>` : ''}</div></div>`;
    }
    return `<div class="s-ad"><div class="ad-fundo" style="background-image:url('${cssUrl(img)}')"></div>
      <img class="ad-img" src="${escapeHtml(img)}" alt="${escapeHtml(a.titulo)}">
      ${a.texto ? `<div class="ad-legenda">${escapeHtml(a.texto)}</div>` : ''}</div>`;
  }

  async function gerarQrs(el){
    const alvos = el.querySelectorAll('[data-qr]');
    if(!alvos.length) return;
    if(!qrPronto){
      qrPronto = new Promise((resolve) => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
        s.onload = () => resolve(true); s.onerror = () => resolve(false);
        document.head.appendChild(s);
      });
    }
    if(!(await qrPronto)) { alvos.forEach(a => a.remove()); return; }
    alvos.forEach(a => { new QRCode(a, { text: a.dataset.qr, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M }); });
  }

  function precarregar(i){
    const item = rodada[i % rodada.length];
    if(!item) return;
    const url = item.tipo === 'parceiro' ? urlPublica(BUCKET_CARTOES, item.dado.cartao_path) : urlPublica(BUCKET_PROPAGANDAS, item.dado.imagem_path);
    if(url){ const im = new Image(); im.src = url; }
  }

  // ---- tempo e navegação ----
  function iniciarTempo(seg){
    restante = seg * 1000; inicioSlide = Date.now();
    const b = $('progressoBarra');
    b.style.animation = 'none'; void b.offsetWidth;
    b.style.animation = `encher ${seg}s linear forwards`;
    b.style.animationPlayState = pausado ? 'paused' : 'running';
    clearTimeout(timer);
    if(!pausado) timer = setTimeout(() => avancar(1), restante);
  }
  function mostrarSlide(i){
    idx = i;
    const item = rodada[i];
    const prox = camadas[1 - camada], atual = camadas[camada];
    prox.innerHTML = item.tipo === 'parceiro' ? htmlParceiro(item.dado) : htmlPropaganda(item.dado);
    atual.classList.remove('visivel'); prox.classList.add('visivel');
    camada = 1 - camada;
    gerarQrs(prox);
    iniciarTempo(item.segundos);
    precarregar(i + 1);
  }
  async function novaRodada(){
    // no fim de cada rodada, busca dados novos se já passou o intervalo (se falhar, segue com os atuais)
    if(Date.now() - ultimaCarga > RECARGA_MS){
      const r = await buscarDados();
      if(r.dados){ dados = r.dados; ultimaCarga = Date.now(); aplicarUnidade(dados.unidade); }
      else if(r.erro === 'invalido'){ clearTimeout(timer); mostrarMensagem('🔒', 'Vitrine indisponível', 'O link foi trocado ou a vitrine foi desligada.'); return false; }
    }
    rodada = montarRodada();
    if(!rodada.length){ ultimaCarga = 0; clearTimeout(timer); mostrarMensagem('📭', 'Nada para exibir', 'Cadastre parceiros (com autorização de divulgação) ou propagandas no app.'); timer = setTimeout(avancar.bind(null, 1), 60000); return false; }
    esconderMensagem();
    return true;
  }
  async function avancar(delta){
    if(!rodada.length || idx + delta >= rodada.length){
      if(!(await novaRodada())) return;
      mostrarSlide(0); return;
    }
    mostrarSlide(idx + delta < 0 ? rodada.length - 1 : idx + delta);
  }
  function alternarPausa(){
    pausado = !pausado;
    const b = $('progressoBarra');
    if(pausado){ restante -= Date.now() - inicioSlide; clearTimeout(timer); b.style.animationPlayState = 'paused'; }
    else { inicioSlide = Date.now(); timer = setTimeout(() => avancar(1), Math.max(300, restante)); b.style.animationPlayState = 'running'; }
    $('btnPausa').textContent = pausado ? '▶' : '⏸';
  }
  function alternarTelaCheia(){
    if(document.fullscreenElement) document.exitFullscreen();
    else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  }

  // ---- controles (somem sozinhos, igual o cursor) ----
  let tempoOcioso = null;
  function mostrarControles(){
    $('controles').classList.add('mostrando'); document.body.classList.remove('sem-cursor');
    clearTimeout(tempoOcioso);
    tempoOcioso = setTimeout(() => { $('controles').classList.remove('mostrando'); document.body.classList.add('sem-cursor'); }, 3000);
  }
  document.addEventListener('mousemove', mostrarControles);
  document.addEventListener('touchstart', mostrarControles, { passive: true });
  $('btnAnterior').addEventListener('click', () => avancar(-1));
  $('btnProximo').addEventListener('click', () => avancar(1));
  $('btnPausa').addEventListener('click', alternarPausa);
  $('btnTelaCheia').addEventListener('click', alternarTelaCheia);
  document.addEventListener('dblclick', alternarTelaCheia);
  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowRight') avancar(1);
    else if(e.key === 'ArrowLeft') avancar(-1);
    else if(e.key === ' '){ e.preventDefault(); alternarPausa(); }
    else if(e.key === 'f' || e.key === 'F') alternarTelaCheia();
  });

  // mantém a tela da TV acordada (quando o navegador permite)
  let wakeLock = null;
  async function pedirWakeLock(){ try{ if(navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){ /* sem suporte/permissão */ } }
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') pedirWakeLock(); });

  async function iniciar(){
    if(!token || token.length < 32){ mostrarMensagem('⚠️', 'Link incompleto', 'Abra a vitrine pelo link gerado no app (aba Vitrine).'); return; }
    const r = await buscarDados();
    if(r.erro === 'invalido'){ mostrarMensagem('🔒', 'Vitrine indisponível', 'O link está incorreto, foi trocado ou a vitrine está desligada.'); return; }
    if(r.erro){ mostrarMensagem('📡', 'Sem conexão', 'Tentando de novo em instantes…'); setTimeout(iniciar, 15000); return; }
    dados = r.dados; ultimaCarga = Date.now();
    aplicarUnidade(dados.unidade);
    pedirWakeLock();
    if(!(await novaRodada())) return;
    mostrarSlide(0);
    mostrarControles();
    $('dica').classList.add('show'); setTimeout(() => $('dica').classList.remove('show'), 6000);
  }

  sb.auth.signOut().finally(iniciar);
</script>
</body>
</html>
