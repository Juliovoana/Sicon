<style>
  :root{
    --bg:#F6F7F9; --surface:#FFFFFF; --border:#E8EAED; --ink:#171E1A;
    --muted:#6B7280; --muted-2:#9AA1A9; --brand:#1B4332; --brand-2:#2D6A4F; --brand-soft:#EAF2EE;
    --accent:#F2A93B; --accent-ink:#8A5E12; --danger:#C0392B; --danger-soft:#FBEAE8; --success-soft:#E8F3EC;
    --shadow-sm: 0 1px 2px rgba(23,30,26,.05), 0 1px 3px rgba(23,30,26,.06);
    --shadow-md: 0 8px 24px -8px rgba(23,30,26,.12);
    --shadow-lg: 0 24px 48px -16px rgba(23,30,26,.22);
    --radius: 14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter', -apple-system, sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased; }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;} }

  .topo{
    background:linear-gradient(155deg, var(--brand) 0%, var(--brand-escuro, #143327) 100%); color:#fff;
    padding:44px 20px 64px; text-align:center; position:relative; overflow:hidden;
    background-size:cover; background-position:center;
  }
  .topo::after{ content:""; position:absolute; inset:0; background:radial-gradient(circle at 80% 0%, rgba(242,169,59,.2), transparent 55%); }
  .topo-conteudo{ position:relative; z-index:1; max-width:520px; margin:0 auto; }
  .topo .marca{ display:flex; align-items:center; justify-content:center; gap:10px; font-weight:700; font-size:1.05rem; margin-bottom:22px; }
  .topo h1{ font-size:1.7rem; font-weight:800; letter-spacing:-.02em; margin-bottom:10px; }
  .topo p{ font-size:.94rem; color:rgba(255,255,255,.82); line-height:1.5; }

  .container{ max-width:560px; margin:-40px auto 60px; padding:0 20px; }
  .card{ background:var(--surface); border-radius:16px; box-shadow:var(--shadow-lg); padding:28px 24px 30px; }

  .secao{ margin-bottom:26px; }
  .secao:last-child{ margin-bottom:0; }
  .secao-titulo{ font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:14px; }

  .field-group{ margin-bottom:16px; }
  .field-group:last-child{ margin-bottom:0; }
  .field-group label{ display:block; font-size:.82rem; font-weight:600; color:var(--ink); margin-bottom:6px; }
  .field-group input, .field-group select, .field-group textarea{
    width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid var(--border);
    font-family:'Inter', sans-serif; font-size:.92rem; background:var(--surface); color:var(--ink);
    outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .field-group input:focus, .field-group select:focus, .field-group textarea:focus{ border-color:var(--brand-2); box-shadow:0 0 0 3px var(--brand-soft); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:480px){ .field-row{ grid-template-columns:1fr; } }

  .image-upload-box{ display:flex; align-items:center; gap:14px; }
  .image-preview-wrap{
    width:76px; height:76px; border-radius:50%; overflow:hidden; flex-shrink:0;
    background:var(--bg); border:1.5px dashed var(--border); display:flex; align-items:center; justify-content:center;
  }
  .image-preview-wrap img{ width:100%; height:100%; object-fit:cover; }
  .image-preview-placeholder{ color:var(--muted-2); }
  .image-preview-placeholder svg{ width:28px; height:28px; }
  .btn-upload-imagem{
    background:var(--surface); border:1.5px solid var(--border); color:var(--ink); font-weight:600; font-size:.85rem;
    padding:10px 16px; border-radius:9px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .btn-upload-imagem:hover{ border-color:var(--brand-2); background:var(--brand-soft); }
  .btn-upload-imagem:disabled{ opacity:.6; cursor:not-allowed; }

  .lista-checkbox-funcoes{ display:flex; flex-direction:column; gap:2px; }
  .check-inline{ display:flex; align-items:center; gap:9px; font-size:.88rem; color:var(--ink); padding:8px 2px; cursor:pointer; }
  .check-inline input{ width:16px; height:16px; accent-color:var(--brand); flex-shrink:0; }

  .btn-primary{
    width:100%; background:var(--brand); color:#fff; border:none; font-weight:700; font-size:.94rem;
    padding:14px; border-radius:10px; cursor:pointer; transition:background .15s, transform .1s; margin-top:6px;
  }
  .btn-primary:hover{ background:#143327; }
  .btn-primary:active{ transform:scale(.98); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }

  .form-erro{ display:none; margin-top:14px; font-size:.85rem; color:var(--danger); background:var(--danger-soft); border-radius:8px; padding:11px 13px; }
  .form-erro.show{ display:block; }
  .btn-remover-documento{
    background:var(--danger-soft); color:var(--danger); border:none; width:26px; height:26px; border-radius:6px;
    cursor:pointer; font-size:.85rem; flex-shrink:0;
  }
  .btn-remover-documento:hover{ background:#f5d6d2; }
  .cpf-aviso{ margin-top:14px; font-size:.85rem; color:var(--brand-2); background:var(--brand-soft); border-radius:8px; padding:11px 13px; }

  .central{ text-align:center; padding:30px 10px; }
  .central .icone{ font-size:2.6rem; margin-bottom:14px; }
  .central h2{ font-size:1.2rem; font-weight:700; margin-bottom:8px; }
  .central p{ font-size:.9rem; color:var(--muted); line-height:1.5; }

  .spinner{ width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--brand); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 14px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://frzvcrcshkpvjdbbqkhz.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_h-JuDyjYgb5YKGYFRKtLEg_8gnJor9w';
  let sb;

  const cardConteudo = document.getElementById('cardConteudo');
  const unidadeId = new URLSearchParams(window.location.search).get('unidade');

  let todasFuncoes = [];
  let fotoUrlEnviada = '';
  let documentosEnviados = []; // [{ nome, url }]
  let situacaoCpf = null; // 'novo' | 'pendente'
  let cpfNormalizado = '';

  function mostrarErroCarga(msg){
    cardConteudo.innerHTML = `
      <div class="central">
        <div class="icone">⚠️</div>
        <h2>Não foi possível abrir o formulário</h2>
        <p>${msg}</p>
      </div>`;
  }

  // -----------------------------------------------------------------
  // Personalização por unidade: se a unidade não tiver escolhido nada,
  // não faz nada aqui (mantém o verde padrão do CSS). Se tiver, troca
  // as variáveis de cor e/ou o fundo do topo pela imagem configurada.
  // -----------------------------------------------------------------
  function clarearCor(hex, percentual){
    hex = (hex || '').replace('#', '');
    if(hex.length !== 6) return hex;
    const r = parseInt(hex.substring(0, 2), 16);
    const g = parseInt(hex.substring(2, 4), 16);
    const b = parseInt(hex.substring(4, 6), 16);
    const misturar = (canal) => Math.round(canal + (255 - canal) * percentual);
    return '#' + [misturar(r), misturar(g), misturar(b)].map(v => v.toString(16).padStart(2, '0')).join('');
  }

  function escurecerCor(hex, percentual){
    hex = (hex || '').replace('#', '');
    if(hex.length !== 6) return hex;
    const r = parseInt(hex.substring(0, 2), 16);
    const g = parseInt(hex.substring(2, 4), 16);
    const b = parseInt(hex.substring(4, 6), 16);
    const escurecer = (canal) => Math.round(canal * (1 - percentual));
    return '#' + [escurecer(r), escurecer(g), escurecer(b)].map(v => v.toString(16).padStart(2, '0')).join('');
  }

  function aplicarPersonalizacao(corPrincipal, imagemFundoUrl){
    if(corPrincipal){
      const raiz = document.documentElement.style;
      raiz.setProperty('--brand', corPrincipal);
      raiz.setProperty('--brand-2', clarearCor(corPrincipal, 0.2));
      raiz.setProperty('--brand-soft', clarearCor(corPrincipal, 0.92));
      raiz.setProperty('--brand-escuro', escurecerCor(corPrincipal, 0.35));
    }
    if(imagemFundoUrl){
      const topo = document.querySelector('.topo');
      topo.style.backgroundImage = `linear-gradient(155deg, rgba(15,43,34,.72) 0%, rgba(15,43,34,.55) 100%), url('${imagemFundoUrl}')`;
    }
  }

  async function carregarFormulario(){
    if(!unidadeId){
      mostrarErroCarga('O link usado está incompleto. Peça o link correto pra empresa que você quer se candidatar.');
      return;
    }

    const { data: unidade, error: erroUnidade } = await sb
      .from('servir_unidades_negocio')
      .select('nome, cor_principal, imagem_fundo_url')
      .eq('id', unidadeId)
      .single();
    if(erroUnidade || !unidade){
      mostrarErroCarga('Não encontramos essa empresa. Confira se o link está correto.');
      return;
    }

    document.getElementById('tituloTopo').textContent = `Faça parte da equipe da ${unidade.nome}`;
    aplicarPersonalizacao(unidade.cor_principal, unidade.imagem_fundo_url);

    const { data: funcoes, error: erroFuncoes } = await sb
      .from('staff_funcoes')
      .select('*')
      .eq('unidade_negocio_id', unidadeId)
      .eq('ativo', true)
      .order('nome', { ascending: true });
    todasFuncoes = erroFuncoes ? [] : (funcoes || []);

    renderFormulario();
  }

  // -----------------------------------------------------------------
  // CPF: máscara e validação de dígito verificador
  // -----------------------------------------------------------------
  function formatarCpfInput(valor){
    let v = valor.replace(/\D/g, '').slice(0, 11);
    if(v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
    else if(v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
    else if(v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
    return v;
  }

  function validarCPF(cpfComMascara){
    const cpf = cpfComMascara.replace(/\D/g, '');
    if(cpf.length !== 11) return false;
    if(/^(\d)\1{10}$/.test(cpf)) return false;
    let soma = 0;
    for(let i = 0; i < 9; i++) soma += parseInt(cpf[i], 10) * (10 - i);
    let resto = (soma * 10) % 11;
    if(resto === 10 || resto === 11) resto = 0;
    if(resto !== parseInt(cpf[9], 10)) return false;
    soma = 0;
    for(let i = 0; i < 10; i++) soma += parseInt(cpf[i], 10) * (11 - i);
    resto = (soma * 10) % 11;
    if(resto === 10 || resto === 11) resto = 0;
    if(resto !== parseInt(cpf[10], 10)) return false;
    return true;
  }

  // -----------------------------------------------------------------
  // Etapa 1: CPF primeiro — antes de mostrar o resto do formulário,
  // confere se esse CPF já tem candidatura/cadastro nesta empresa.
  // -----------------------------------------------------------------
  function renderFormulario(){
    cardConteudo.innerHTML = `
      <div class="secao" id="secaoCpf">
        <div class="secao-titulo">Antes de começar</div>
        <div class="field-group">
          <label>Seu CPF</label>
          <input type="text" id="f_cpf" placeholder="000.000.000-00" maxlength="14">
        </div>
        <button class="btn-primary" id="btnVerificarCpf">Continuar</button>
        <div class="form-erro" id="cpfErro"></div>
        <div class="cpf-aviso" id="cpfAviso" style="display:none;"></div>
      </div>
      <div id="restoFormulario"></div>
    `;

    const inputCpf = document.getElementById('f_cpf');
    inputCpf.addEventListener('input', () => { inputCpf.value = formatarCpfInput(inputCpf.value); });
    inputCpf.addEventListener('keydown', e => { if(e.key === 'Enter') verificarCpf(); });
    document.getElementById('btnVerificarCpf').addEventListener('click', verificarCpf);
    inputCpf.focus();
  }

  async function verificarCpf(){
    const cpfDigitado = document.getElementById('f_cpf').value;
    const cpfErro = document.getElementById('cpfErro');
    const cpfAviso = document.getElementById('cpfAviso');
    cpfErro.classList.remove('show');
    cpfAviso.style.display = 'none';

    if(!validarCPF(cpfDigitado)){
      cpfErro.textContent = 'CPF inválido. Confira os números digitados.';
      cpfErro.classList.add('show');
      return;
    }

    const btn = document.getElementById('btnVerificarCpf');
    btn.disabled = true;
    btn.textContent = 'Verificando...';

    try{
      cpfNormalizado = cpfDigitado.replace(/\D/g, '');
      const { data: situacao, error } = await sb.rpc('fn_staff_verificar_cpf_candidatura', {
        p_unidade_negocio_id: unidadeId,
        p_cpf: cpfNormalizado
      });
      if(error) throw new Error(error.message);

      if(situacao === 'ativo'){
        cpfAviso.style.display = 'block';
        cpfAviso.textContent = 'Já existe um cadastro ativo com esse CPF nesta empresa. Se precisar alterar alguma informação, entre em contato diretamente com a empresa.';
        btn.disabled = true;
        return;
      }

      situacaoCpf = situacao; // 'novo' ou 'pendente'
      document.getElementById('f_cpf').disabled = true;
      btn.style.display = 'none';

      if(situacao === 'pendente'){
        cpfAviso.style.display = 'block';
        cpfAviso.textContent = 'Encontramos uma candidatura sua ainda em análise nesta empresa. Preencha os dados abaixo pra atualizá-la.';
      }

      renderRestoFormulario();
    } catch(erro){
      cpfErro.textContent = 'Erro ao verificar CPF: ' + erro.message;
      cpfErro.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Continuar';
    }
  }

  // -----------------------------------------------------------------
  // Etapa 2: resto do formulário, liberado só depois do CPF conferido
  // -----------------------------------------------------------------
  function renderRestoFormulario(){
    const optionsFuncaoPrincipal = todasFuncoes.map(f => `<option value="${f.id}">${f.nome}</option>`).join('');
    const checkboxesFuncoesSecundarias = todasFuncoes.map(f => `
      <label class="check-inline"><input type="checkbox" class="check-funcao-secundaria" value="${f.id}"> ${f.nome}</label>
    `).join('');

    document.getElementById('restoFormulario').innerHTML = `
      <div class="secao">
        <div class="secao-titulo">Sua foto</div>
        <div class="image-upload-box">
          <div class="image-preview-wrap">
            <img id="previewFoto" src="" style="display:none;">
            <div class="image-preview-placeholder" id="placeholderFoto">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </div>
          </div>
          <button type="button" class="btn-upload-imagem" id="btnEscolherFoto">Tirar/escolher foto</button>
          <input type="file" id="inputFoto" accept="image/*" capture="user" style="display:none;">
        </div>
      </div>

      <div class="secao">
        <div class="secao-titulo">Documentos (opcional)</div>
        <p style="font-size:.82rem; color:var(--muted); margin-bottom:12px;">Currículo completo, certificados, ou qualquer outro documento que queira anexar.</p>
        <div id="listaDocumentosAnexados"></div>
        <button type="button" class="btn-upload-imagem" id="btnAnexarDocumento">+ Anexar documento</button>
        <input type="file" id="inputDocumento" accept="image/*,application/pdf,.doc,.docx" style="display:none;">
        <p class="form-erro" id="documentoErro"></p>
      </div>

      <div class="secao">
        <div class="secao-titulo">Seus dados</div>
        <div class="field-group"><label>Nome completo</label><input type="text" id="f_nome_completo" placeholder="Seu nome completo"></div>
        <div class="field-group"><label>WhatsApp</label><input type="text" id="f_whatsapp" placeholder="(00) 00000-0000"></div>
        <div class="field-group"><label>E-mail</label><input type="email" id="f_email" placeholder="seu@email.com"></div>
        <div class="field-group"><label>Cidade / endereço</label><input type="text" id="f_endereco" placeholder="Onde você mora"></div>
        <label class="check-inline"><input type="checkbox" id="f_pcd"> Sou Pessoa com Deficiência (PCD)</label>
      </div>

      <div class="secao">
        <div class="secao-titulo">Habilidades</div>
        <div class="field-group">
          <label>Sua principal habilidade</label>
          <select id="f_funcao_principal_id">
            <option value="">Selecione...</option>
            ${optionsFuncaoPrincipal}
          </select>
        </div>
        ${todasFuncoes.length ? `
          <div class="field-group">
            <label>Outras habilidades que você também tem</label>
            <div class="lista-checkbox-funcoes">${checkboxesFuncoesSecundarias}</div>
          </div>
        ` : ''}
        <div class="field-group"><label>Conte um pouco sobre você (opcional)</label><textarea id="f_observacoes" rows="3" placeholder="Experiência, disponibilidade, o que você quiser contar"></textarea></div>
      </div>

      <button class="btn-primary" id="btnEnviarCandidatura">Enviar candidatura</button>
      <div class="form-erro" id="formErro"></div>
    `;

    document.getElementById('btnEscolherFoto').addEventListener('click', () => document.getElementById('inputFoto').click());
    document.getElementById('inputFoto').addEventListener('change', async (e) => {
      const arquivo = e.target.files[0];
      if(arquivo) await enviarFoto(arquivo);
    });
    document.getElementById('btnAnexarDocumento').addEventListener('click', () => document.getElementById('inputDocumento').click());
    document.getElementById('inputDocumento').addEventListener('change', async (e) => {
      const arquivo = e.target.files[0];
      if(arquivo) await anexarDocumento(arquivo);
      e.target.value = ''; // permite anexar outro arquivo com o mesmo nome depois
    });
    document.getElementById('btnEnviarCandidatura').addEventListener('click', enviarCandidatura);
  }

  // -----------------------------------------------------------------
  // Foto: comprime no navegador antes de enviar
  // -----------------------------------------------------------------
  function comprimirImagem(arquivo, maxDimensao = 480, qualidade = 0.65){
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(arquivo);
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDimensao || height > maxDimensao){
          if(width > height){ height = Math.round(height * (maxDimensao / width)); width = maxDimensao; }
          else { width = Math.round(width * (maxDimensao / height)); height = maxDimensao; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(url);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Não foi possível processar a imagem.')), 'image/jpeg', qualidade);
      };
      img.onerror = () => reject(new Error('Não foi possível ler o arquivo de imagem.'));
      img.src = url;
    });
  }

  async function enviarFoto(arquivo){
    const btn = document.getElementById('btnEscolherFoto');
    const textoOriginal = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Enviando...';
    try{
      const blobComprimido = await comprimirImagem(arquivo);
      const caminho = `${unidadeId}/candidato-${Date.now()}/foto-${Date.now()}.jpg`;

      const { error: erroUpload } = await sb.storage
        .from('staff-documentos')
        .upload(caminho, blobComprimido, { upsert: true, contentType: 'image/jpeg' });
      if(erroUpload) throw new Error(erroUpload.message);

      const { data } = sb.storage.from('staff-documentos').getPublicUrl(caminho);
      fotoUrlEnviada = data.publicUrl;
      const preview = document.getElementById('previewFoto');
      preview.src = data.publicUrl;
      preview.style.display = 'block';
      document.getElementById('placeholderFoto').style.display = 'none';
      btn.textContent = 'Trocar foto';
    } catch(erro){
      alert('Erro ao enviar foto: ' + erro.message);
      btn.textContent = textoOriginal;
    } finally{
      btn.disabled = false;
    }
  }

  // -----------------------------------------------------------------
  // Documentos: currículo ou outros — aceita imagem, PDF ou Word.
  // Só imagem passa por compressão; os demais sobem como estão.
  // Ficam guardados localmente até o envio final da candidatura.
  // -----------------------------------------------------------------
  async function anexarDocumento(arquivo){
    const btn = document.getElementById('btnAnexarDocumento');
    const erroEl = document.getElementById('documentoErro');
    erroEl.classList.remove('show');
    const textoOriginal = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Enviando...';
    try{
      const ehImagem = arquivo.type.startsWith('image/');
      const blobFinal = ehImagem ? await comprimirImagem(arquivo, 1400, 0.8) : arquivo;
      const nomeSeguro = arquivo.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
      const caminho = `${unidadeId}/candidato-${cpfNormalizado || Date.now()}/doc-${Date.now()}-${nomeSeguro}`;

      const { error: erroUpload } = await sb.storage
        .from('staff-documentos')
        .upload(caminho, blobFinal, { upsert: true, contentType: ehImagem ? 'image/jpeg' : (arquivo.type || 'application/octet-stream') });
      if(erroUpload) throw new Error(erroUpload.message);

      const { data } = sb.storage.from('staff-documentos').getPublicUrl(caminho);
      documentosEnviados.push({ nome: arquivo.name, url: data.publicUrl });
      renderListaDocumentos();
    } catch(erro){
      erroEl.textContent = 'Erro ao anexar: ' + erro.message;
      erroEl.classList.add('show');
    } finally{
      btn.disabled = false;
      btn.textContent = textoOriginal;
    }
  }

  function renderListaDocumentos(){
    const lista = document.getElementById('listaDocumentosAnexados');
    if(documentosEnviados.length === 0){ lista.innerHTML = ''; return; }
    lista.innerHTML = documentosEnviados.map((doc, i) => `
      <div style="display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-bottom:6px;">
        <span style="flex:1; font-size:.82rem; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">📎 ${doc.nome}</span>
        <button type="button" class="btn-remover-documento" data-indice="${i}" title="Remover">✕</button>
      </div>
    `).join('');
    lista.querySelectorAll('.btn-remover-documento').forEach(btn => {
      btn.addEventListener('click', () => {
        documentosEnviados.splice(Number(btn.dataset.indice), 1);
        renderListaDocumentos();
      });
    });
  }

  // -----------------------------------------------------------------
  // Envio da candidatura
  // -----------------------------------------------------------------
  function mostrarErroFormulario(msg){
    const el = document.getElementById('formErro');
    el.textContent = msg;
    el.classList.add('show');
  }

  async function enviarCandidatura(){
    const nomeCompleto = document.getElementById('f_nome_completo').value.trim();
    const whatsapp = document.getElementById('f_whatsapp').value.trim();
    const email = document.getElementById('f_email').value.trim();
    const endereco = document.getElementById('f_endereco').value.trim();
    const pcd = document.getElementById('f_pcd').checked;
    const funcaoPrincipalId = document.getElementById('f_funcao_principal_id').value;
    const observacoes = document.getElementById('f_observacoes').value.trim();

    document.getElementById('formErro').classList.remove('show');

    if(!nomeCompleto){ mostrarErroFormulario('Informe seu nome completo.'); return; }
    if(!whatsapp){ mostrarErroFormulario('Informe seu WhatsApp de contato.'); return; }
    if(!funcaoPrincipalId){ mostrarErroFormulario('Selecione sua principal habilidade.'); return; }

    const btn = document.getElementById('btnEnviarCandidatura');
    btn.disabled = true;
    btn.textContent = 'Enviando...';

    try{
      const funcoesSecundarias = [...document.querySelectorAll('.check-funcao-secundaria:checked')].map(el => el.value);

      // Passa pela função do banco (não insert direto): ela decide
      // sozinha se é candidatura nova, atualização de uma pendente, ou
      // se já existe cadastro ativo com esse CPF (nesse caso não altera
      // nada e devolve 'ativo').
      const { data: resultado, error: erroSalvar } = await sb.rpc('fn_staff_salvar_candidatura', {
        p_unidade_negocio_id: unidadeId,
        p_cpf: cpfNormalizado,
        p_nome_completo: nomeCompleto,
        p_telefone: null,
        p_whatsapp: whatsapp || null,
        p_email: email || null,
        p_endereco: endereco || null,
        p_foto_url: fotoUrlEnviada || null,
        p_funcao_principal_id: funcaoPrincipalId,
        p_observacoes: observacoes || null,
        p_pcd: pcd,
        p_funcoes_secundarias: funcoesSecundarias
      });
      if(erroSalvar) throw new Error(erroSalvar.message);

      if(resultado === 'ativo'){
        mostrarErroFormulario('Já existe um cadastro ativo com esse CPF nesta empresa. Entre em contato diretamente com a empresa pra alterar seus dados.');
        btn.disabled = false;
        btn.textContent = 'Enviar candidatura';
        return;
      }

      // documentos ficam num caminho separado da candidatura em si —
      // o vínculo com o profissional certo acontece sozinho no banco,
      // batendo pelo CPF (não precisa do id que a RPC não devolve)
      if(documentosEnviados.length > 0){
        const linhasDocumentos = documentosEnviados.map(doc => ({
          unidade_negocio_id: unidadeId,
          cpf: cpfNormalizado,
          nome_arquivo: doc.nome,
          url: doc.url,
        }));
        const { error: erroDocumentos } = await sb.from('staff_profissional_documentos').insert(linhasDocumentos);
        if(erroDocumentos) console.error('Erro ao vincular documentos:', erroDocumentos.message);
      }

      cardConteudo.innerHTML = `
        <div class="central">
          <div class="icone">✅</div>
          <h2>Recebemos sua candidatura!</h2>
          <p>Nossa equipe vai analisar seu cadastro e entrar em contato quando surgir uma oportunidade. Obrigado pelo interesse!</p>
        </div>`;
    } catch(erro){
      mostrarErroFormulario('Erro ao enviar: ' + erro.message);
      btn.disabled = false;
      btn.textContent = 'Enviar candidatura';
    }
  }

  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });

  // Garante que nenhuma sessão de admin guardada no navegador (ex: de
  // quem também testa o painel logado no mesmo dispositivo) seja usada
  // aqui por engano — este formulário deve SEMPRE agir como anônimo.
  sb.auth.signOut().finally(carregarFormulario);
</script>
