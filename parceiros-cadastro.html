<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Seja nosso parceiro</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' rx='46' fill='%231B4332'/%3E%3Ccircle cx='72' cy='72' r='24' fill='%23F0F4EE'/%3E%3Ccircle cx='132' cy='72' r='24' fill='%23F2A93B'/%3E%3Cpath d='M26 158c4-32 24-46 46-46s42 14 46 46zM86 158c4-32 24-46 46-46s42 14 46 46z' fill='%23F0F4EE' opacity='.92'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F7F9; --surface:#FFFFFF; --border:#E8EAED; --ink:#171E1A;
    --muted:#6B7280; --muted-2:#9AA1A9; --brand:#1B4332; --brand-2:#2D6A4F; --brand-soft:#EAF2EE;
    --accent:#F2A93B; --danger:#C0392B; --danger-soft:#FBEAE8;
    --shadow-lg: 0 24px 48px -16px rgba(23,30,26,.22);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter', -apple-system, sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased; }

  .topo{
    background:linear-gradient(155deg, var(--brand) 0%, var(--brand-escuro, #143327) 100%); color:#fff;
    padding:44px 20px 64px; text-align:center; position:relative; overflow:hidden; background-size:cover; background-position:center;
  }
  .topo::after{ content:""; position:absolute; inset:0; background:radial-gradient(circle at 80% 0%, rgba(242,169,59,.2), transparent 55%); }
  .topo-conteudo{ position:relative; z-index:1; max-width:520px; margin:0 auto; }
  .topo .marca{ font-weight:700; font-size:1.05rem; margin-bottom:20px; opacity:.9; }
  .topo h1{ font-size:1.7rem; font-weight:800; letter-spacing:-.02em; margin-bottom:10px; }
  .topo p{ font-size:.94rem; color:rgba(255,255,255,.85); line-height:1.5; }

  .container{ max-width:560px; margin:-40px auto 60px; padding:0 20px; position:relative; z-index:2; }
  .card{ background:var(--surface); border-radius:16px; box-shadow:var(--shadow-lg); padding:28px 24px 30px; }

  .secao-titulo{ font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:6px 0 14px; }
  .field-group{ margin-bottom:16px; }
  .field-group label{ display:block; font-size:.82rem; font-weight:600; margin-bottom:6px; }
  .field-group .dica{ font-weight:400; color:var(--muted); font-size:.76rem; }
  .field-group input[type=text], .field-group input[type=email], .field-group input[type=tel], .field-group select, .field-group textarea{
    width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid var(--border);
    font-family:'Inter', sans-serif; font-size:.92rem; background:var(--surface); color:var(--ink); outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .field-group textarea{ resize:vertical; min-height:70px; }
  .field-group input:focus, .field-group select:focus, .field-group textarea:focus{ border-color:var(--brand-2); box-shadow:0 0 0 3px var(--brand-soft); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:480px){ .field-row{ grid-template-columns:1fr; } }

  .foto-box{ display:flex; align-items:center; gap:14px; }
  .foto-preview{ width:96px; height:64px; border-radius:10px; overflow:hidden; flex-shrink:0; background:var(--bg); border:1.5px dashed var(--border); display:flex; align-items:center; justify-content:center; color:var(--muted-2); font-size:1.4rem; }
  .foto-preview img{ width:100%; height:100%; object-fit:cover; }
  .btn-sec{ background:var(--surface); border:1.5px solid var(--border); color:var(--ink); font-weight:600; font-size:.85rem; padding:10px 16px; border-radius:9px; cursor:pointer; }
  .btn-sec:hover{ border-color:var(--brand-2); background:var(--brand-soft); }

  .check{ display:flex; align-items:flex-start; gap:10px; font-size:.84rem; line-height:1.45; margin:6px 0 18px; cursor:pointer; }
  .check input{ width:18px; height:18px; margin-top:1px; accent-color:var(--brand); flex-shrink:0; }
  .btn-primary{ width:100%; background:var(--brand); color:#fff; border:none; font-weight:700; font-size:.96rem; padding:14px; border-radius:10px; cursor:pointer; transition:background .15s, transform .1s; }
  .btn-primary:hover{ background:var(--brand-2); }
  .btn-primary:active{ transform:scale(.98); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
  .form-erro{ display:none; margin-top:14px; font-size:.85rem; color:var(--danger); background:var(--danger-soft); border-radius:8px; padding:11px 13px; }
  .form-erro.show{ display:block; }
  .rodape-lgpd{ margin-top:16px; font-size:.74rem; color:var(--muted); line-height:1.45; text-align:center; }
  .armadilha{ position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }

  .central{ text-align:center; padding:30px 10px; }
  .central .icone{ font-size:2.6rem; margin-bottom:14px; }
  .central h2{ font-size:1.2rem; font-weight:700; margin-bottom:8px; }
  .central p{ font-size:.9rem; color:var(--muted); line-height:1.5; }
  .spinner{ width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--brand); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 14px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

  <div class="topo">
    <div class="topo-conteudo">
      <div class="marca" id="marcaTopo">Servir</div>
      <h1 id="tituloTopo">Seja nosso parceiro</h1>
      <p id="subtituloTopo">Cadastre-se grátis e receba indicações de clientes que precisam do seu serviço.</p>
    </div>
  </div>

  <div class="container">
    <div class="card" id="cardConteudo">
      <div class="central"><div class="spinner"></div><p>Carregando...</p></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://frzvcrcshkpvjdbbqkhz.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_h-JuDyjYgb5YKGYFRKtLEg_8gnJor9w';
  const BUCKET_CARTOES = 'parceiros-cartoes';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });

  const cardConteudo = document.getElementById('cardConteudo');
  const unidadeId = new URLSearchParams(window.location.search).get('unidade');
  let info = null;
  let fotoBlob = null;

  function escapeHtml(t){ const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
  function mostrarMensagem(icone, titulo, texto){
    cardConteudo.innerHTML = `<div class="central"><div class="icone">${icone}</div><h2>${escapeHtml(titulo)}</h2><p>${escapeHtml(texto)}</p></div>`;
  }

  // ---- personalização por unidade (mesmo padrão do formulário do Staff) ----
  function clarearCor(hex, p){
    hex = (hex || '').replace('#', ''); if(hex.length !== 6) return hex;
    const c = [0, 2, 4].map(i => parseInt(hex.substr(i, 2), 16));
    return '#' + c.map(v => Math.round(v + (255 - v) * p).toString(16).padStart(2, '0')).join('');
  }
  function escurecerCor(hex, p){
    hex = (hex || '').replace('#', ''); if(hex.length !== 6) return hex;
    const c = [0, 2, 4].map(i => parseInt(hex.substr(i, 2), 16));
    return '#' + c.map(v => Math.round(v * (1 - p)).toString(16).padStart(2, '0')).join('');
  }
  function aplicarPersonalizacao(cor, imagem){
    if(/^#[0-9a-fA-F]{6}$/.test(cor || '')){
      const raiz = document.documentElement.style;
      raiz.setProperty('--brand', cor);
      raiz.setProperty('--brand-2', clarearCor(cor, 0.2));
      raiz.setProperty('--brand-soft', clarearCor(cor, 0.92));
      raiz.setProperty('--brand-escuro', escurecerCor(cor, 0.35));
    }
    if(imagem && /^https:\/\//.test(imagem)){
      document.querySelector('.topo').style.backgroundImage = `linear-gradient(155deg, rgba(15,43,34,.72) 0%, rgba(15,43,34,.55) 100%), url('${encodeURI(imagem).replace(/'/g, '%27')}')`;
    }
  }

  async function carregarFormulario(){
    if(!unidadeId){ mostrarMensagem('⚠️', 'Link incompleto', 'O link usado está incompleto. Peça o link ou o QR Code correto na loja.'); return; }
    const { data, error } = await sb.rpc('parceiros_publico_info', { p_unidade_id: unidadeId });
    if(error || !data || !data.nome){ mostrarMensagem('⚠️', 'Não foi possível abrir o formulário', 'Não encontramos essa loja. Confira se o link está correto.'); return; }
    info = data;
    document.title = `Seja parceiro da ${info.nome}`;
    document.getElementById('tituloTopo').textContent = `Seja parceiro da ${info.nome}`;
    document.getElementById('marcaTopo').textContent = info.nome;
    aplicarPersonalizacao(info.cor_principal, info.imagem_fundo_url);
    if(!info.ativo){ mostrarMensagem('🔒', 'Cadastro indisponível', 'Esta loja não está recebendo novos cadastros de parceiros no momento. Fale com a equipe da loja.'); return; }
    if(info.mensagem) document.getElementById('subtituloTopo').textContent = info.mensagem;
    renderFormulario();
  }

  function formatarFoneInput(v){
    v = v.replace(/\D/g, '').slice(0, 11);
    if(v.length > 6) return v.length > 10 ? v.replace(/(\d{2})(\d{5})(\d{1,4})/, '($1) $2-$3') : v.replace(/(\d{2})(\d{4})(\d{1,4})/, '($1) $2-$3');
    if(v.length > 2) return v.replace(/(\d{2})(\d{1,5})/, '($1) $2');
    return v;
  }

  function renderFormulario(){
    const ramos = info.ramos || [];
    cardConteudo.innerHTML = `
      <div class="secao-titulo">Seus dados</div>
      <div class="field-group"><label>Seu nome *</label><input type="text" id="f_nome" maxlength="120" autocomplete="name"></div>
      <div class="field-group"><label>Nome da empresa <span class="dica">(se tiver)</span></label><input type="text" id="f_empresa" maxlength="120"></div>
      <div class="field-row">
        <div class="field-group"><label>WhatsApp *</label><input type="tel" id="f_whatsapp" placeholder="(00) 00000-0000" autocomplete="tel"></div>
        <div class="field-group"><label>Cidade *</label><input type="text" id="f_cidade" maxlength="80"></div>
      </div>
      <div class="secao-titulo" style="margin-top:22px;">Seu trabalho</div>
      <div class="field-group"><label>Ramo de atividade *</label>
        <select id="f_ramo"><option value="">— selecione —</option>${ramos.map(r => `<option value="${escapeHtml(r.id)}">${escapeHtml(r.nome)}</option>`).join('')}</select></div>
      <div class="field-group"><label>O que você faz? <span class="dica">(especialidades)</span></label><input type="text" id="f_especialidades" maxlength="300" placeholder="Ex: reforma de banheiro, assentamento de piso"></div>
      <div class="field-group"><label>Conte um pouco sobre seu trabalho</label><textarea id="f_descricao" maxlength="600"></textarea></div>
      <div class="field-group"><label>Foto do seu cartão de visita <span class="dica">(opcional)</span></label>
        <div class="foto-box">
          <div class="foto-preview" id="fotoPreview">📇</div>
          <div><button type="button" class="btn-sec" id="btnFoto">Enviar foto</button><input type="file" id="inputFoto" accept="image/*" style="display:none;"></div>
        </div></div>
      <div class="secao-titulo" style="margin-top:22px;">Contato extra <span class="dica" style="text-transform:none; letter-spacing:0;">(opcional)</span></div>
      <div class="field-row">
        <div class="field-group"><label>E-mail</label><input type="email" id="f_email" maxlength="120" autocomplete="email"></div>
        <div class="field-group"><label>CPF ou CNPJ</label><input type="text" id="f_documento" maxlength="20"></div>
      </div>
      <div class="armadilha" aria-hidden="true"><label>Site <input type="text" id="f_site" tabindex="-1" autocomplete="off"></label></div>
      <label class="check"><input type="checkbox" id="f_autoriza"> <span>Autorizo a loja a guardar meus dados e a passar meu nome e contato para clientes que precisarem do meu serviço. *</span></label>
      <button class="btn-primary" id="btnEnviar">Enviar cadastro</button>
      <div class="form-erro" id="formErro"></div>
      <p class="rodape-lgpd">Seu cadastro será analisado pela equipe da loja. Você pode pedir a exclusão dos seus dados a qualquer momento falando com a loja.</p>`;
    document.getElementById('f_whatsapp').addEventListener('input', e => { e.target.value = formatarFoneInput(e.target.value); });
    document.getElementById('btnFoto').addEventListener('click', () => document.getElementById('inputFoto').click());
    document.getElementById('inputFoto').addEventListener('change', async (e) => {
      const arquivo = e.target.files[0];
      if(!arquivo) return;
      try{
        fotoBlob = await comprimirImagem(arquivo);
        const prev = document.getElementById('fotoPreview');
        prev.innerHTML = `<img alt="Cartão de visita" src="${URL.createObjectURL(fotoBlob)}">`;
        document.getElementById('btnFoto').textContent = 'Trocar foto';
      } catch(erro){ fotoBlob = null; mostrarErro(erro.message); }
    });
    document.getElementById('btnEnviar').addEventListener('click', enviarCadastro);
  }

  function comprimirImagem(arquivo, maxDimensao = 1400, qualidade = 0.82){
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(arquivo);
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDimensao || height > maxDimensao){
          if(width > height){ height = Math.round(height * (maxDimensao / width)); width = maxDimensao; }
          else { width = Math.round(width * (maxDimensao / height)); height = maxDimensao; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(url);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Não foi possível processar a imagem.')), 'image/jpeg', qualidade);
      };
      img.onerror = () => reject(new Error('Não foi possível ler o arquivo de imagem.'));
      img.src = url;
    });
  }

  function mostrarErro(msg){
    const el = document.getElementById('formErro');
    el.textContent = msg; el.classList.add('show');
  }

  async function enviarCadastro(){
    document.getElementById('formErro').classList.remove('show');
    const v = (id) => document.getElementById(id).value.trim();
    const nome = v('f_nome'), whatsapp = v('f_whatsapp').replace(/\D/g, ''), cidade = v('f_cidade'), ramoId = v('f_ramo');
    const documento = v('f_documento').replace(/\D/g, '');
    if(!nome){ mostrarErro('Informe seu nome.'); return; }
    if(whatsapp.length < 10){ mostrarErro('Informe seu WhatsApp com DDD.'); return; }
    if(!cidade){ mostrarErro('Informe sua cidade.'); return; }
    if(!ramoId){ mostrarErro('Escolha seu ramo de atividade.'); return; }
    if(documento && documento.length !== 11 && documento.length !== 14){ mostrarErro('CPF deve ter 11 números e CNPJ 14 (ou deixe em branco).'); return; }
    if(!document.getElementById('f_autoriza').checked){ mostrarErro('Marque a autorização pra poder enviar o cadastro.'); return; }

    const btn = document.getElementById('btnEnviar');
    btn.disabled = true; btn.textContent = 'Enviando...';
    // campo-armadilha preenchido = robô: finge que deu certo e não manda nada
    if(v('f_site')){ mostrarMensagem('✅', 'Recebemos seu cadastro!', 'Nossa equipe vai analisar e entrar em contato.'); return; }
    try{
      let cartaoPath = null;
      if(fotoBlob){
        cartaoPath = `${unidadeId}/${crypto.randomUUID()}.jpg`;
        const { error: erroUp } = await sb.storage.from(BUCKET_CARTOES).upload(cartaoPath, fotoBlob, { contentType: 'image/jpeg' });
        if(erroUp) throw new Error('Não foi possível enviar a foto do cartão. Tente de novo ou envie sem foto.');
      }
      const { data: resultado, error } = await sb.rpc('parceiros_autocadastro', {
        p_unidade_id: unidadeId,
        p_dados: {
          nome, empresa: v('f_empresa'), whatsapp, cidade, ramo_id: ramoId, especialidades: v('f_especialidades'),
          descricao: v('f_descricao'), email: v('f_email'), documento: v('f_documento'), cartao_path: cartaoPath,
          autorizou_divulgacao: true,
        },
      });
      if(error) throw new Error('Não foi possível enviar agora. Tente de novo em instantes.');
      if(resultado === 'ok'){
        mostrarMensagem('✅', 'Recebemos seu cadastro!', 'Nossa equipe vai analisar e, aprovado, você passa a receber indicações de clientes. Obrigado!');
        return;
      }
      const msgs = {
        duplicado: 'Esse WhatsApp já está cadastrado nesta loja. Se precisar corrigir seus dados, fale com a equipe da loja.',
        desativado: 'Esta loja não está recebendo cadastros no momento.',
        limite: 'Recebemos muitos cadastros em pouco tempo. Tente de novo mais tarde.',
        invalido: 'Confira os campos obrigatórios e tente de novo.',
      };
      throw new Error(msgs[resultado] || 'Não foi possível concluir o cadastro.');
    } catch(erro){
      mostrarErro(erro.message);
      btn.disabled = false; btn.textContent = 'Enviar cadastro';
    }
  }

  // sempre anônimo: ignora qualquer sessão de admin guardada neste navegador
  sb.auth.signOut().finally(carregarFormulario);
</script>
</body>
</html>
