<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Painel financeiro</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%231f6f4a'/%3E%3Cpath d='M16 46V30M28 46V18M40 46V26M52 46V12' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f4f6f5; --card:#ffffff; --ink:#18241f; --muted:#5d6b64; --line:#dfe5e2;
    --brand:#1f6f4a; --brand-soft:#e3f1ea; --pos:#1f7a4d; --neg:#b3261e; --info:#2b6cb0;
    --warn:#9a6200; --warn-bg:#fff0cf; --bad-bg:#fde4e1; --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121715; --card:#1b2420; --ink:#e8efeb; --muted:#9fb0a7; --line:#2b3832; --brand:#58c28d; --brand-soft:#1d3329;
      --pos:#6fd6a1; --neg:#ff8f86; --info:#7db4f0; --warn:#f0be5d; --warn-bg:#3a2d10; --bad-bg:#401c19; }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; line-height:1.4; -webkit-text-size-adjust:100%; }
  .pagina{ max-width:1200px; margin:0 auto; padding:16px; }
  a{ color:var(--brand); }
  .topo{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .topo h1{ margin:0; font-size:1.3rem; }
  .sub{ color:var(--muted); font-size:.9rem; margin-top:2px; }
  .acoes{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .btn-ic{ width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center; text-decoration:none; }
  .btn-ic:hover{ border-color:var(--brand); }
  .btn-ic.girando span{ display:inline-block; animation:gira .8s linear infinite; }
  @keyframes gira{ to{ transform:rotate(360deg); } }
  #arquivosCsv{ display:none; }
  .btn{ border:none; border-radius:8px; padding:8px 13px; font-size:.88rem; font-weight:700; cursor:pointer; background:var(--brand); color:#fff; }
  @media (prefers-color-scheme: dark){ .btn{ color:#0c1a13; } }
  .btn.sec{ background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .btn.mini{ padding:4px 9px; font-size:.78rem; }
  .aviso{ border-radius:var(--radius); padding:10px 14px; margin-bottom:12px; font-size:.92rem; border:1px solid var(--line); background:var(--brand-soft); }
  .aviso.alerta{ background:var(--warn-bg); color:var(--warn); border-color:var(--warn); }
  .aviso.erro{ background:var(--bad-bg); color:var(--neg); border-color:var(--neg); }
  .aviso[hidden]{ display:none; }

  /* filtros */
  .filtros{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px; margin-bottom:12px; }
  .linha-filtros{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .campo label{ display:block; font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px; }
  .campo input[type=date], .campo select, .busca{ border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:7px 9px; font-size:.9rem; }
  .busca{ width:100%; }
  .painel{ border:1px solid var(--line); border-radius:10px; background:var(--card); }
  .painel > summary{ list-style:none; cursor:pointer; padding:8px 12px; font-size:.9rem; font-weight:700; display:flex; gap:8px; align-items:center; }
  .painel > summary::-webkit-details-marker{ display:none; }
  .painel > summary::before{ content:'▸'; color:var(--muted); }
  .painel[open] > summary::before{ content:'▾'; }
  .painel .conta-resumo{ color:var(--muted); font-weight:500; font-size:.82rem; }
  .painel .corpo{ padding:8px 12px 12px; border-top:1px solid var(--line); max-height:380px; overflow:auto; }
  .paineis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px; margin-top:10px; align-items:start; }
  .lista-chk label{ display:flex; gap:8px; align-items:center; padding:3px 0; font-size:.88rem; cursor:pointer; }
  .lista-chk .n{ margin-left:auto; color:var(--muted); font-size:.78rem; white-space:nowrap; }
  .chip{ display:inline-block; border-radius:999px; padding:1px 8px; font-size:.7rem; font-weight:700; background:var(--warn-bg); color:var(--warn); }
  .ferramentas{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .arvore details{ margin-left:14px; }
  .arvore summary{ cursor:pointer; padding:2px 0; font-size:.88rem; list-style:none; display:flex; gap:6px; align-items:center; }
  .arvore summary::-webkit-details-marker{ display:none; }
  .arvore summary::before{ content:'▸'; color:var(--muted); width:10px; }
  .arvore details[open] > summary::before{ content:'▾'; }
  .arvore .folha{ margin-left:30px; display:flex; gap:6px; align-items:center; font-size:.85rem; padding:1px 0; }
  .arvore label{ display:flex; gap:6px; align-items:center; cursor:pointer; }
  .opcao-t{ display:flex; gap:8px; align-items:flex-start; padding:8px 12px; border:1px solid var(--line); border-radius:10px; margin-top:10px; font-size:.88rem; cursor:pointer; background:var(--card); }
  .opcao-t small{ color:var(--muted); display:block; }

  /* abas */
  .abas{ display:flex; gap:6px; margin:4px 0 12px; flex-wrap:wrap; }
  .aba{ border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:7px 16px; font-weight:700; cursor:pointer; font-size:.9rem; }
  .aba.ativo{ background:var(--brand); border-color:var(--brand); color:#fff; }
  @media (prefers-color-scheme: dark){ .aba.ativo{ color:#0c1a13; } }

  .ver{ margin-left:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .ver button{ border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:999px; padding:6px 13px; font-weight:700; cursor:pointer; font-size:.85rem; text-decoration:line-through; }
  .ver button.ativo{ background:var(--brand-soft); color:var(--ink); border-color:var(--brand); text-decoration:none; }
  /* conteúdo */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .kpi{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; }
  .kpi span{ display:block; color:var(--muted); font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; }
  .kpi b{ font-size:1.15rem; }
  .pos{ color:var(--pos); } .neg{ color:var(--neg); }
  .grade2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:12px; margin-bottom:14px; }
  .graf{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px; min-width:0; }
  .graf h3{ margin:0 0 8px; font-size:.95rem; }
  .graf .area{ position:relative; height:300px; }
  .graf.alto .area{ height:420px; }
  .tabela-box{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-bottom:14px; }
  .rolagem{ overflow-x:auto; }
  table{ border-collapse:collapse; width:100%; font-size:.9rem; }
  th, td{ padding:8px 10px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child{ text-align:left; }
  td.txt, th.txt{ text-align:left; }
  td.hist{ text-align:left; white-space:normal; overflow-wrap:anywhere; min-width:200px; }
  th{ background:var(--brand-soft); font-size:.74rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); position:sticky; top:0; }
  tfoot td{ font-weight:800; background:var(--brand-soft); }
  tr.clicavel{ cursor:pointer; } tr.clicavel:hover{ background:var(--brand-soft); }
  tr.n1 td{ font-weight:800; } tr.n2 td:first-child{ padding-left:26px; } tr.n3 td:first-child{ padding-left:48px; }
  tr.n2 td, tr.n3 td{ font-weight:500; }
  .seta{ display:inline-block; width:14px; color:var(--muted); }
  .barra-v{ display:inline-block; height:8px; border-radius:4px; background:var(--brand); vertical-align:middle; }
  .barra-v.d{ background:var(--neg); }
  .acao{ border:none; background:none; cursor:pointer; font-size:.95rem; padding:0 3px; }
  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .toolbar .busca{ flex:1; min-width:160px; width:auto; }
  .seg{ display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
  .seg button{ border:none; background:var(--card); color:var(--ink); padding:6px 14px; font-weight:700; cursor:pointer; font-size:.85rem; }
  .seg button.ativo{ background:var(--brand); color:#fff; }
  @media (prefers-color-scheme: dark){ .seg button.ativo{ color:#0c1a13; } }
  .chip-f{ background:var(--brand-soft); border-radius:999px; padding:4px 10px; font-size:.82rem; font-weight:700; display:inline-flex; gap:6px; align-items:center; }
  .chip-f button{ border:none; background:none; cursor:pointer; color:inherit; font-size:1rem; padding:0; }
  .vazio{ text-align:center; color:var(--muted); padding:36px 16px; background:var(--card); border:1px dashed var(--line); border-radius:var(--radius); }
  .mais{ text-align:center; margin:10px 0; }
  .rodape{ color:var(--muted); font-size:.8rem; text-align:center; margin:18px 0 6px; }
  details.dados{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px 14px; margin-top:14px; font-size:.88rem; }
  details.dados summary{ cursor:pointer; font-weight:700; }
  details.dados ul{ margin:8px 0 0; padding-left:18px; color:var(--muted); }
  /* resumo da barra (popup) */
  .fundo{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-start; justify-content:center; padding:16px; z-index:50; overflow:auto; }
  .fundo[hidden]{ display:none; }
  .caixa{ background:var(--card); border-radius:var(--radius); padding:16px 18px; max-width:760px; width:100%; margin:auto; }
  .caixa h3{ margin:0 0 4px; font-size:1.05rem; }
  .caixa .fecha{ float:right; border:none; background:none; color:var(--muted); font-size:1.6rem; cursor:pointer; line-height:1; }
  .caixa h4{ margin:14px 0 6px; font-size:.82rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .caixa table{ font-size:.86rem; }
  .caixa th, .caixa td{ padding:6px 8px; }
  .caixa .nome{ white-space:normal; overflow-wrap:anywhere; }
  .caixa .btns{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .resumo-kpis{ display:flex; gap:14px; flex-wrap:wrap; font-size:.9rem; color:var(--muted); margin:4px 0 0; }
  .resumo-kpis b{ color:var(--ink); }
  .dica-clique{ color:var(--muted); font-size:.78rem; margin:-6px 0 8px; }
  .sub-titulo{ margin:16px 0 8px; font-size:.82rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; }
  .alerta-fluxo{ border-radius:var(--radius); padding:10px 14px; margin-bottom:12px; font-size:.92rem; background:var(--bad-bg); color:var(--neg); border:1px solid var(--neg); }
  .alerta-fluxo.ok{ background:var(--brand-soft); color:var(--ink); border-color:var(--line); }
  .campo-mini{ display:inline-flex; gap:6px; align-items:center; font-size:.85rem; color:var(--muted); }
  .campo-mini input, .campo-mini select{ border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:6px 9px; font-size:.88rem; }
  .campo-mini input{ width:130px; text-align:right; }
  tr.linha-atraso td{ background:var(--bad-bg); }
  tr.linha-hoje td{ font-weight:700; }
  @media (max-width:640px){
    .pagina{ padding:12px; }
    th, td{ padding:7px 7px; font-size:.82rem; }
    .grade2{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="pagina">
  <div class="topo">
    <div>
      <h1>Painel financeiro</h1>
      <div class="sub" id="subtitulo">Receitas e despesas por plano de contas, conta e empresa</div>
    </div>
    <div class="acoes">
      <a class="btn-ic" href="fechamento-caixas.html" title="Fechamento de caixas" aria-label="Fechamento de caixas">✔</a>
      <a class="btn-ic" href="extratos-contas.html" title="Extratos das contas" aria-label="Extratos das contas">☰</a>
      <a class="btn-ic" href="analise-cruzada.html" title="Análise cruzada por setor e por mês (Excel)" aria-label="Análise cruzada">▦</a>
      <a class="btn-ic" href="resumo-diario.html" title="Resumo diário: saldo das contas e contas a pagar/receber" aria-label="Resumo diário">▥</a>
      <label class="btn-ic" for="arquivosCsv" title="Abrir CSV deste computador (dados_mov_caixa.csv e, se quiser, plano_contas.csv)" aria-label="Importar CSV">📂</label>
      <input type="file" id="arquivosCsv" accept=".csv,text/csv" multiple>
      <button class="btn-ic" id="btnAtualizar" title="Atualizar" aria-label="Atualizar"><span>⟳</span></button>
    </div>
  </div>

  <div class="aviso" id="aviso" hidden></div>

  <div id="app" hidden>
    <div class="filtros">
      <div class="linha-filtros">
        <div class="campo"><label for="fPeriodo">Período</label>
          <select id="fPeriodo">
            <option value="tudo">Tudo</option><option value="mes">Mês atual</option><option value="mesant">Mês anterior</option>
            <option value="3m">Últimos 3 meses</option><option value="12m">Últimos 12 meses</option><option value="ano">Este ano</option>
            <option value="anoant">Ano anterior</option><option value="custom">Personalizado…</option>
          </select></div>
        <div class="campo"><label for="fDe">De</label><input type="date" id="fDe"></div>
        <div class="campo"><label for="fAte">Até</label><input type="date" id="fAte"></div>
        <div class="campo" style="margin-left:auto"><button class="btn sec mini" id="btnLimpar" type="button" title="Volta os filtros para o padrão (contas de passagem desmarcadas)">Restaurar padrão</button></div>
      </div>
      <div class="paineis">
        <details class="painel" id="pEmp"><summary>Empresas <span class="conta-resumo" id="rEmp"></span></summary><div class="corpo"><div class="ferramentas"><button class="btn sec mini" data-f="emp-todas" type="button">Marcar todas</button><button class="btn sec mini" data-f="emp-nenhuma" type="button">Limpar</button></div><div class="lista-chk" id="listaEmp"></div></div></details>
        <details class="painel" id="pSet" hidden><summary>Setores <span class="conta-resumo" id="rSet"></span></summary><div class="corpo"><div class="ferramentas"><button class="btn sec mini" data-f="set-todas" type="button">Marcar todos</button><button class="btn sec mini" data-f="set-nenhuma" type="button">Limpar</button></div><div class="lista-chk" id="listaSet"></div></div></details>
        <details class="painel" id="pCta"><summary>Contas <span class="conta-resumo" id="rCta"></span></summary><div class="corpo"><div class="ferramentas"><button class="btn sec mini" data-f="cta-padrao" type="button">Padrão (sem passagem)</button><button class="btn sec mini" data-f="cta-todas" type="button">Marcar todas</button><button class="btn sec mini" data-f="cta-nenhuma" type="button">Limpar</button></div><div class="lista-chk" id="listaCta"></div></div></details>
        <details class="painel" id="pPla"><summary>Plano de contas <span class="conta-resumo" id="rPla"></span></summary><div class="corpo"><input type="search" class="busca" id="buscaPlano" placeholder="Buscar conta ou grupo…" style="margin-bottom:8px"><div class="ferramentas"><button class="btn sec mini" data-f="pla-todas" type="button">Marcar todas</button><button class="btn sec mini" data-f="pla-nenhuma" type="button">Limpar</button></div><div class="arvore" id="arvorePlano"></div></div></details>
      </div>
      <label class="opcao-t"><input type="checkbox" id="fOcultarT" checked>
        <span><b>Ocultar transferências entre contas marcadas</b>
        <small id="infoOcultarT">Uma transferência aparece como receita numa conta e despesa na outra. Quando as duas pontas estão marcadas, as duas são ocultadas — senão o valor conta em dobro.</small></span></label>
    </div>

    <div class="abas" id="abas">
      <button class="aba ativo" data-aba="geral" type="button">Visão geral</button>
      <button class="aba" data-aba="plano" type="button">Plano de contas</button>
      <button class="aba" data-aba="contas" type="button">Contas</button>
      <button class="aba" data-aba="empresas" type="button">Empresas</button>
      <button class="aba" data-aba="setores" id="abaSetores" type="button" hidden>Setores</button>
      <button class="aba" data-aba="titulos" id="abaTitulos" type="button" hidden>A pagar e receber</button>
      <button class="aba" data-aba="fluxo" id="abaFluxo" type="button">Fluxo de caixa</button>
      <button class="aba" data-aba="lanc" type="button">Lançamentos</button>
      <div class="ver" id="ver" title="Vale para todos os gráficos e indicadores (também dá para clicar na legenda de um gráfico)">
        <span class="sub">Mostrar:</span>
        <button type="button" class="ativo" data-ver="r">Receitas</button>
        <button type="button" class="ativo" data-ver="s">Despesas</button>
        <button type="button" class="ativo" data-ver="res">Resultado</button>
      </div>
    </div>
    <div id="conteudo"></div>
    <details class="dados" id="dadosInfo"><summary>Sobre os dados</summary><ul id="dadosLista"></ul></details>
  </div>
  <div id="inicio"></div>
  <div class="rodape" id="rodape"></div>
</div>

<div class="fundo" id="popupResumo" hidden>
  <div class="caixa" role="dialog" aria-modal="true" aria-labelledby="resumoTitulo">
    <button class="fecha" id="resumoFechar" type="button" aria-label="Fechar">×</button>
    <h3 id="resumoTitulo"></h3>
    <div class="resumo-kpis" id="resumoKpis"></div>
    <div id="resumoCorpo"></div>
    <div class="btns">
      <button class="btn" id="resumoVer" type="button">Ver todos os lançamentos</button>
      <button class="btn sec" id="resumoSair" type="button">Fechar</button>
    </div>
  </div>
</div>

<script src="servir-acesso.js"></script>
<script>
(function(){
  'use strict';
  const $ = (id) => document.getElementById(id);
  function el(tag, cls, texto){ const e = document.createElement(tag); if(cls) e.className = cls; if(texto !== undefined && texto !== null) e.textContent = texto; return e; }
  const semAcento = (s) => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const URL_SCRIPT_OK = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/;

  // ===================== formatação =====================
  const arred = (n) => { const r = Math.round((n + Number.EPSILON) * 100) / 100; return r === 0 ? 0 : r; };
  const fmt = (n) => arred(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtR = (n) => (n < 0 ? '-' : '') + 'R$ ' + Math.round(Math.abs(n)).toLocaleString('pt-BR');
  const fmtPct = (n) => (isFinite(n) ? n.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) : '0') + '%';
  const fmtDia = (iso) => iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4);
  const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const nomeMes = (ym) => MESES[+ym.slice(5, 7) - 1] + '/' + ym.slice(2, 4);
  const isoData = (s) => { s = String(s || '').trim(); let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1] + '-' + m[2] + '-' + m[3]; m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/); return m ? m[3] + '-' + m[2] + '-' + m[1] : ''; };
  const num = (s) => { s = String(s || '').trim(); if(!s) return 0; const n = parseFloat(s.replace(',', '.')); return isNaN(n) ? 0 : n; };
  const hoje = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const somaDias = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };

  // ===================== CSV =====================
  function lerCsv(texto){
    texto = String(texto || '').replace(/^﻿/, '');
    const primeira = texto.split(/\r?\n/, 1)[0] || '';
    const cont = (c) => (primeira.match(new RegExp('\\' + c, 'g')) || []).length;
    const sep = [';', ',', '\t'].sort((a, b) => cont(b) - cont(a))[0];
    const linhas = []; let campo = '', linha = [], aspas = false;
    for(let i = 0; i < texto.length; i++){
      const c = texto[i];
      if(aspas){ if(c === '"'){ if(texto[i + 1] === '"'){ campo += '"'; i++; } else aspas = false; } else campo += c; }
      else if(c === '"') aspas = true;
      else if(c === sep){ linha.push(campo); campo = ''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && texto[i + 1] === '\n') i++;
        linha.push(campo); campo = '';

  // ===================== modelo =====================

  const normPlano = (c) => {
    c = String(c || '').trim().replace(/\.+$/, '');

  function apelidoEmpresa(cod, razao){
    if(!razao) return cod && cod !== '0' ? 'Empresa ' + cod : 'Sem empresa';
    const toks = razao.replace(/\s+/g, ' ').trim().split(' '); const out = [];
    for(const t of toks){ if(out.length && (STOP_EMP.has(t.toUpperCase()) || out.length >= 3)) break; out.push(t); }

  }

  function montar(textos){
    const t = lerCsv(textos[ARQ.mov]);
    const ix = (n) => t.cab.indexOf(n);
    const I = { tipo: ix('tipo'), data: ix('data'), cod: ix('cod_conta'), conta: ix('nome_conta_caixa'), contra: ix('cod_cta_transferencia'),
      rec: ix('receita'), desp: ix('despesa'), hist: ix('historico'), plano: ix('codcta'), nplano: ix('nomecta'), cli: ix('cliente'),
      setor: ix('setor'), dset: ix('descricao_setor'), emp: ix('empresa'), razao: ix('empresaa_razao_social') >= 0 ? ix('empresaa_razao_social') : ix('empresa_razao_social'),
      quit: ix('quitado'), vv: ix('valor_vencimento'), dv: ix('data_vencimento') };
    const falta = ['tipo', 'data', 'conta', 'rec', 'desp', 'plano', 'emp'].filter(k => I[k] < 0);
    if(falta.length) throw new Error('O arquivo de movimentação precisa ter as colunas TIPO, DATA, NOME_CONTA_CAIXA, RECEITA, DESPESA, CODCTA e EMPRESA (faltando: ' + falta.join(', ') + ').');

    const L = [], ci = new Map(), cpc = new Map(), em = new Map(), pl = new Map(), sts = new Map(); const comSetor = I.setor >= 0;
    const q = { total: t.linhas.length, dataInvalida: 0, dataFutura: 0, semPlano: 0, semEmpresa: 0, semConta: 0, semSetor: 0, ate: '', de: '',
      titulos: 0, tituloSemVenc: 0, tituloZero: 0, vencSuspeito: 0, vencLiqInvalido: 0 };
    const limite = somaDias(hoje(), 90);
    const temTit = I.quit >= 0 && I.vv >= 0 && I.dv >= 0; const TT = [];
    const venc5 = somaDias(hoje(), 1825);
    for(const l of t.linhas){
      // título EM ABERTO (QUITADO = A): não é movimento de caixa — vai para a lista de contas a pagar/receber
      if(temTit && String(l[I.quit] || '').trim().toUpperCase() === 'A'){
        const tp = String(l[I.tipo] || '').trim().toUpperCase(), venc = isoData(l[I.dv]), val = num(l[I.vv]);
        if(!venc){ q.tituloSemVenc++; continue; }
        if(val <= 0 || (tp !== 'R' && tp !== 'D')){ q.tituloZero++; continue; }
        let ec = String(l[I.emp] || '').trim(); const rz = I.razao >= 0 ? String(l[I.razao] || '').trim() : '';
        if(!ec || ec === '0') ec = '0';
        let sc = comSetor ? String(l[I.setor] || '').trim() : ''; if(comSetor && (!sc || sc === '0')) sc = '0';
        const pcT = normPlano(l[I.plano]);
        TT.push({ tp, v: val, venc, emp: ec, st: sc, pc: pcT, cl: I.cli >= 0 ? String(l[I.cli] || '').trim() : '', h: I.hist >= 0 ? l[I.hist] : '' });
        q.titulos++; if(venc > venc5) q.vencSuspeito++;
        if(!em.has(ec)) em.set(ec, { cod: ec, razao: rz, nome: '', n: 0, rec: 0, desp: 0 }); else if(rz && !em.get(ec).razao) em.get(ec).razao = rz;
        if(comSetor && !sts.has(sc)) sts.set(sc, { cod: sc, nome: '', n: 0, rec: 0, desp: 0 });

      c.n++; c.rec += r; c.desp += s; if(cc && cc !== '0' && conta !== '(sem conta)') cpc.set(cc, conta);
      if(comSetor){ let o = sts.get(scod); if(!o){ o = { cod: scod, nome: '', n: 0, rec: 0, desp: 0 }; sts.set(scod, o); } o.n++; o.rec += r; o.desp += s; const dn = I.dset >= 0 ? String(l[I.dset] || '').trim() : ''; if(dn && !o.nome) o.nome = dn; }

  // nome de um nó do plano (nível 1 = 'NN', nível 2 = 'NN.NN', nível 3 = 'NN.NN.NN')
  function nomeNo(cod){
    if(nomesLocais[cod]) return nomesLocais[cod];

  }
  const rotuloNo = (cod) => { const n = nomeNo(cod); return n ? cod + ' · ' + n : cod; };

  // ===================== filtros =====================
  const FIL = { periodo: '3m', de: '', ate: '', empOff: new Set(), setOff: new Set(), ctaOff: new Set(), plaOff: new Set(), ocultarT: true };
  function filtrosPadrao(){
    FIL.periodo = '3m'; FIL.de = '';     // padrão: últimos 3 meses (mês atual + 2 anteriores); "Tudo" é só escolher no período FIL.ate = ''; FIL.empOff = new Set(); FIL.setOff = new Set(); FIL.ocultarT = true; FIL.plaOff = new Set();

  }
  function carregarFiltrosSalvos(){
    filtrosPadrao();

    // contas: o que o usuário já viu mantém a escolha dele; conta nova só entra desmarcada se parecer de passagem
    const conhecidas = new Set(s.conhecidas || []), off = new Set(s.ctaOff || []);

  function intervalo(){
    const h = hoje(), a = +h.slice(0, 4), m = +h.slice(5, 7);
    const p2 = (n) => String(n).padStart(2, '0');
    const ultimoDia = (ano, mes) => new Date(ano, mes, 0).getDate();
    switch(FIL.periodo){
      case 'mes': return [a + '-' + p2(m) + '-01', h];
      case 'mesant': { const d = new Date(a, m - 2, 1); const ya = d.getFullYear(), ma = d.getMonth() + 1; return [ya + '-' + p2(ma) + '-01', ya + '-' + p2(ma) + '-' + p2(ultimoDia(ya, ma))]; }
      case '3m': { const d = new Date(a, m - 3, 1); return [d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-01', h]; }
      case '12m': { const d = new Date(a, m - 12, 1); return [d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-01', h]; }

  function filtrar(){
    const [de, ate] = intervalo();
    const out = []; const oculta = { n: 0, r: 0, s: 0 };
    for(const x of linhas){
      if(de && x.d < de) continue; if(ate && x.d > ate) continue;
      if(FIL.empOff.has(x.emp)) continue;
      if(temSetor && FIL.setOff.has(x.st)) continue;
      if(FIL.ctaOff.has(x.ct)) continue;
      if(FIL.plaOff.has(x.pc)) continue;
      if(FIL.ocultarT && x.tp === 'T' && x.cx && x.cx !== '0'){
        const nomeContra = contaPorCod.get(x.cx);
        if(nomeContra && !FIL.ctaOff.has(nomeContra)){ oculta.n++; oculta.r += x.r; oculta.s += x.s; continue; }   // as duas pontas estão marcadas
      }
      out.push(x);

    return { rows: out, oculta, de, ate };
  }

  // ===================== painéis de filtro =====================

  function construirArvore(){
    const raiz = $('arvorePlano'); raiz.replaceChildren();

    const n1 = new Map();
    [...planos.values()].sort((a, b) => (a.cod < b.cod ? -1 : 1)).forEach(p => {
      if(termo && !(semAcento(rotuloNo(p.cod)).includes(termo) || semAcento(rotuloNo(p.n2)).includes(termo) || semAcento(rotuloNo(p.n1)).includes(termo))) return;

        if(atualizado && r.atualizado !== atualizado){ mudou = true; break; }        // o coletor gravou o arquivo no meio da leitura
        atualizado = r.atualizado; partes.push(r.texto);
        $('rodape').textContent = 'Baixando ' + n + '… ' + mb(Math.min(r.proximo, r.total)) + ' de ' + mb(r.total || bytes);
        if(r.proximo >= r.total) break;
        if(r.proximo <= inicio) throw new Error('A leitura em partes de ' + n + ' não avançou.');
        inicio = r.proximo;
      }
      if(!mudou) return { texto: partes.join(''), atualizado };
    }
    throw new Error('O arquivo ' + n + ' mudou várias vezes durante a leitura — tente atualizar de novo em instantes.');
  }
  async function baixarArquivo(n, bytes){
    if(!(bytes > LIMITE_LEITURA_DIRETA)){
      const r = await chamar('&acao=ler&arquivos=' + encodeURIComponent(n)); const f = r.arquivos[n];
      if(f && f.texto != null) return { texto: f.texto, atualizado: f.atualizado };
      if(!(f && (f.grande || /exced|maxim|too large/i.test(f.erro || '')))) return null;   // outro erro: segue sem esse arquivo
    }
    return baixarEmPartes(n, bytes);
  }

  async function carregar(){
    if(!cfg.url || !cfg.token){ if(!linhas.length) mostrarInicio(); return; }
    const btn = $('btnAtualizar'); btn.classList.add('girando'); btn.disabled = true;
    try {
      if(!bd) bd = await abrirBd();
      if(!linhas.length) $('inicio').replaceChildren(el('div', 'vazio', 'Carregando…'));
      const lista = await chamar('&acao=listar');
      const quando = {}, tamanho = {}; lista.arquivos.forEach(a => { quando[a.arquivo] = a.atualizado; tamanho[a.arquivo] = a.bytes; });
      if(!quando[ARQ.mov]) throw new Error('O arquivo ' + ARQ.mov + ' não está na pasta do Drive. Confira se o coletor está gerando esse CSV.');
      const nomes = [ARQ.mov, ARQ.plano, ARQ.status].filter(n => quando[n]);
      const textos = {}, baixar = [];
      for(const n of nomes){ const c = await cacheGet(cacheUn + n); if(c && c.atualizado === quando[n]) textos[n] = c.texto; else baixar.push(n); }
      if(baixar.length){
        $('rodape').textContent = 'Baixando ' + baixar.join(', ') + '… (o arquivo de movimentação é grande, pode levar alguns segundos)';
        for(const n of baixar){                                  // um por vez: respostas grandes
          const f = await baixarArquivo(n, tamanho[n]);
          if(f && f.texto != null){ textos[n] = f.texto; await cachePut(cacheUn + n, { atualizado: quando[n], texto: f.texto }); }
        }
      }
      if(!textos[ARQ.mov]) throw new Error('Não consegui ler ' + ARQ.mov + '.');
      aplicar(textos, 'Dados do Drive — movimentação atualizada em ' + new Date(quando[ARQ.mov]).toLocaleString('pt-BR'));
      avisoColeta(textos[ARQ.status]);
    } catch(err){
      console.error(err);
      aviso('erro', (linhas.length ? 'Não consegui atualizar agora (mostrando os últimos dados): ' : '') + err.message);
      if(!linhas.length) $('inicio').replaceChildren();
    } finally { btn.classList.remove('girando'); btn.disabled = false; }
  }
  function avisoColeta(statusTexto){
    let msg = '', tipo = 'alerta';
    try { if(statusTexto){ const s = JSON.parse(statusTexto), q = new Date(s.executado_em), h = (Date.now() - q.getTime()) / 3600000;
      if(s.ok === false){ msg = 'A última coleta (' + q.toLocaleString('pt-BR') + ') teve erro em algum arquivo — os dados podem estar desatualizados.'; tipo = 'erro'; }
      else if(h > 3) msg = 'A coleta no computador da empresa não roda desde ' + q.toLocaleString('pt-BR') + ' — os dados podem estar desatualizados.'; } } catch(e){}
    aviso(tipo, msg);
  }
  function mostrarInicio(){
    const v = el('div', 'vazio'); v.appendChild(el('div', '', 'Nenhum dado carregado.'));
    const p = el('div', ''); p.appendChild(document.createTextNode('Configure o endereço do script e o token no ')); const a = el('a', '', 'painel de fechamentos (⚙)'); a.href = 'fechamento-caixas.html'; p.appendChild(a);
    p.appendChild(document.createTextNode(' — vale aqui também — ou abra o ' + ARQ.mov + ' (📂).')); v.appendChild(p); $('inicio').replaceChildren(v); $('app').hidden = true;
  }

  $('arquivosCsv').addEventListener('change', async (ev) => {
    const arqs = [...ev.target.files]; if(!arqs.length) return;
    const textos = {};
    for(const f of arqs){ const nome = f.name.toLowerCase(); const texto = await f.text(); if(nome.includes('plano')) textos[ARQ.plano] = texto; else if(nome.includes('status')) textos[ARQ.status] = texto; else textos[ARQ.mov] = texto; }
    if(!textos[ARQ.mov]){ aviso('erro', 'Escolha também o arquivo ' + ARQ.mov + '.'); ev.target.value = ''; return; }
    try { aplicar(textos, 'Arquivo aberto neste computador: ' + arqs.map(f => f.name).join(', ')); aviso('', ''); } catch(err){ aviso('erro', err.message); }
    ev.target.value = '';
  });

  // ===================== eventos de interface =====================
  let tRender; const agendar = () => { clearTimeout(tRender); tRender = setTimeout(render, 60); };
  $('btnAtualizar').addEventListener('click', carregar);
  $('ver').addEventListener('click', (e) => { const b = e.target.closest('button[data-ver]'); if(!b) return; VER[b.dataset.ver] = !VER[b.dataset.ver]; render(); });
  $('abas').addEventListener('click', (e) => { const b = e.target.closest('.aba'); if(!b) return; abaAtual = b.dataset.aba; if(abaAtual === 'lanc') limiteLanc = 300; render(); });
  $('fPeriodo').addEventListener('change', () => { FIL.periodo = $('fPeriodo').value; if(FIL.periodo === 'custom'){ [FIL.de, FIL.ate] = [$('fDe').value, $('fAte').value]; } agendar(); });
  ['fDe', 'fAte'].forEach(id => $(id).addEventListener('change', () => { FIL.periodo = 'custom'; FIL.de = $('fDe').value; FIL.ate = $('fAte').value; agendar(); }));
  $('fOcultarT').addEventListener('change', () => { FIL.ocultarT = $('fOcultarT').checked; salvarFiltros(); agendar(); });
  $('buscaPlano').addEventListener('input', () => construirArvore());
  $('btnLimpar').addEventListener('click', () => { filtrosPadrao(); salvarFiltros(); construirFiltros(); zerarDrill(); render(); });
  $('resumoFechar').addEventListener('click', fecharResumo); $('resumoSair').addEventListener('click', fecharResumo);
  $('popupResumo').addEventListener('click', (e) => { if(e.target === $('popupResumo')) fecharResumo(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && !$('popupResumo').hidden) fecharResumo(); });
  $('resumoVer').addEventListener('click', () => { const d = descAberta; if(!d) return; fecharResumo(); irLancamentos(Object.assign({}, d.patch, { lado: d.lado === 'rs' ? '' : d.lado })); });
  document.addEventListener('change', (e) => {
    const t = e.target; if(!(t instanceof HTMLInputElement)) return;
    if(t.dataset.emp !== undefined){ if(t.checked) FIL.empOff.delete(t.dataset.emp); else FIL.empOff.add(t.dataset.emp); }
    else if(t.dataset.set !== undefined){ if(t.checked) FIL.setOff.delete(t.dataset.set); else FIL.setOff.add(t.dataset.set); }
    else if(t.dataset.cta !== undefined){ if(t.checked) FIL.ctaOff.delete(t.dataset.cta); else FIL.ctaOff.add(t.dataset.cta); salvarFiltros(); }
    else if(t.dataset.plaGrupo !== undefined){ t.dataset.plaGrupo.split('|').forEach(c => { if(t.checked) FIL.plaOff.delete(c); else FIL.plaOff.add(c); }); salvarFiltros(); construirArvore(); }
    else return;
    atualizarResumosFiltro(); agendar();
  });
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-f]'); if(!b) return; const f = b.dataset.f;
    if(f === 'set-todas') FIL.setOff = new Set(); if(f === 'set-nenhuma') FIL.setOff = new Set(setores.keys());
    if(f === 'emp-todas') FIL.empOff = new Set(); if(f === 'emp-nenhuma') FIL.empOff = new Set(empresas.keys());
    if(f === 'cta-todas') FIL.ctaOff = new Set(); if(f === 'cta-nenhuma') FIL.ctaOff = new Set(contasInfo.keys());
    if(f === 'cta-padrao') FIL.ctaOff = new Set([...contasInfo.keys()].filter(ehPassagem));
    if(f === 'pla-todas') FIL.plaOff = new Set(); if(f === 'pla-nenhuma') FIL.plaOff = new Set(planos.keys());
    salvarFiltros(); construirFiltros(); agendar();
  });

  // expõe só para teste/diagnóstico
  window.__pf = { aplicar, get F(){ return F; }, FIL, render, get linhas(){ return linhas; }, get charts(){ return instancias; }, abrirResumo, resumir, nomeDoHistorico, contraparte };

  // acesso: login do Servir + credenciais da unidade (servir-acesso.js); o link antigo com token segue como modo reserva
  let cacheUn = '';        // o cache local é separado por unidade (senão trocar de unidade misturaria os arquivos)
  (async function iniciar(){
    bd = await abrirBd();
    ServirAcesso.preparar({
      modulo: 'painel_financeiro',
      legado: () => !!(cfg.url && cfg.token),
      aoLegado: () => carregar(),
      aoPronto: (cred, ctx) => {
        cfg.url = cred.url; cfg.token = cred.token; cacheUn = ctx.unidade.id + ':';
        if(cred.arquivos.mov) ARQ.mov = cred.arquivos.mov; if(cred.arquivos.plano) ARQ.plano = cred.arquivos.plano;
        carregar();
      }
    });
  })();
})();
</script>
