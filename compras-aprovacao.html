<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aprovação de Compras · Servir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#1B4332;--verde2:#2D6A4F;--verdec:#EAF2EE;
  --fundo:#F6F7F9;--painel:#FFFFFF;--linha:#E8EAED;
  --texto:#171E1A;--texto2:#6B7280;--texto3:#9AA1A9;
  --sucesso:#2D6A4F;--sucessob:#E8F3EC;
  --vermelho:#C0392B;--vermelhob:#FBEAE8;
  --amarelo:#8A5E12;--amarelob:#FEF3E2;--amarelo-forte:#F2A93B;
  --raio:12px;--sombra:0 2px 12px rgba(23,30,26,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;font-family:'Inter',system-ui,sans-serif;background:var(--fundo);color:var(--texto)}

/* ── LOGIN ── */
#tela-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#1B4332 0%,#143327 100%)}
.login-card{width:100%;max-width:380px;background:var(--painel);border-radius:var(--raio);padding:32px 28px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.login-logo-icon{width:42px;height:42px;background:var(--verde);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.login-titulo{font-size:1.2rem;font-weight:700;color:var(--verde);line-height:1.2}
.login-sub{font-size:.8rem;color:var(--texto2);margin-top:2px}
.campo{margin-bottom:14px}
.campo label{display:block;font-size:.72rem;font-weight:700;color:var(--texto2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
input{width:100%;background:var(--painel);border:1.5px solid var(--linha);color:var(--texto);padding:10px 12px;border-radius:8px;font-size:.95rem;font-family:inherit;transition:border-color .15s}
input:focus{outline:none;border-color:var(--verde)}
.btn-primary{width:100%;background:var(--verde);color:#fff;border:none;border-radius:8px;padding:12px;font-size:.95rem;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s;margin-top:4px}
.btn-primary:hover{background:#143327}
.msg-erro{color:var(--vermelho);font-size:.82rem;margin-top:10px;min-height:1.1em}
.msg-ok{color:var(--sucesso);font-size:.82rem;margin-top:10px;min-height:1.1em}
.link-sutil{background:none;border:none;color:var(--verde2);font-size:.82rem;cursor:pointer;font-family:inherit;text-decoration:underline}

/* ── CARREGANDO ── */
#tela-loading{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--fundo)}
.loading-wrap{text-align:center;color:var(--texto2)}
.spin-grande{width:36px;height:36px;border:3px solid var(--linha);border-top-color:var(--verde);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── APP ── */
#tela-app{display:none;min-height:100vh}
header{background:var(--verde);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:10}
.header-esq{display:flex;align-items:center;gap:10px}
.header-icon{width:34px;height:34px;background:rgba(255,255,255,.15);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.header-titulo{font-size:.95rem;font-weight:700}
.header-sub{font-size:.72rem;opacity:.7;margin-top:1px}

/* ── ABAS ── */
.abas{display:flex;background:var(--painel);border-bottom:2px solid var(--linha);overflow-x:auto}
.aba{flex:1;min-width:100px;padding:12px 8px;text-align:center;font-size:.78rem;font-weight:600;color:var(--texto2);cursor:pointer;border:none;background:none;font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .15s}
.aba.on{color:var(--verde);border-bottom-color:var(--verde)}
.aba .badge{display:inline-block;background:var(--amarelob);color:var(--amarelo);font-size:.68rem;font-weight:700;border-radius:10px;padding:1px 6px;margin-left:4px}
.aba.on .badge{background:var(--verdec);color:var(--verde)}

main{max-width:680px;margin:0 auto;padding:16px}

/* ── CARDS ── */
.sol-card{background:var(--painel);border:1px solid var(--linha);border-left:4px solid var(--linha);border-radius:var(--raio);overflow:hidden;box-shadow:var(--sombra);margin-bottom:12px;cursor:pointer;transition:box-shadow .15s}
.sol-card:hover{box-shadow:0 4px 20px rgba(23,30,26,.14)}
.sol-card.urgente{border-left-color:var(--amarelo-forte)}
.sol-card-header{padding:14px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sol-num{font-size:.8rem;font-weight:700;color:var(--texto2)}
.tag-urgente{display:inline-flex;align-items:center;gap:4px;background:var(--amarelo-forte);color:#3d2a06;font-size:.64rem;font-weight:700;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.03em;margin-left:6px}
.sol-desc{font-size:.95rem;font-weight:600;color:var(--texto);margin-top:2px}
.sol-meta{font-size:.82rem;color:var(--texto2);margin-top:2px}
.sol-valor{font-size:1rem;font-weight:700;color:var(--verde);white-space:nowrap;text-align:right}
.sol-data{font-size:.72rem;color:var(--texto3);text-align:right;margin-top:2px}
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap;margin-top:4px}
.sp{background:var(--amarelob);color:var(--amarelo)}
.sa{background:var(--sucessob);color:var(--sucesso)}
.sr{background:var(--vermelhob);color:var(--vermelho)}

/* ── DETALHE ── */
#tela-detalhe{display:none}
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--verde);font-size:.88rem;font-weight:600;cursor:pointer;font-family:inherit;padding:0;margin-bottom:14px}
.back-btn svg{width:16px;height:16px}
.det-card{background:var(--painel);border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden;box-shadow:var(--sombra);margin-bottom:12px}
.det-header{background:var(--verde);color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.det-numero{font-size:1.1rem;font-weight:700}
.det-data{font-size:.78rem;opacity:.75}
.det-body{padding:18px}
.det-linha{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.det-campo{flex:1;min-width:130px}
.det-campo label{display:block;font-size:.68rem;font-weight:700;color:var(--texto2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.det-campo .val{font-size:.9rem;font-weight:500;color:var(--texto)}
hr.div{border:none;border-top:1px solid var(--linha);margin:14px 0}
.total-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--fundo);border-radius:8px;margin-bottom:14px}
.total-label{font-size:.82rem;color:var(--texto2)}
.total-valor{font-size:1.2rem;font-weight:700;color:var(--verde)}
.prod-tab{width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:14px}
.prod-tab th{background:var(--fundo);color:var(--texto2);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:7px 10px;text-align:left;border-bottom:1px solid var(--linha)}
.prod-tab td{padding:7px 10px;border-bottom:1px solid var(--linha)}
.prod-tab tr:last-child td{border-bottom:none}
.prod-tab .r{text-align:right}
.link-anexo{display:inline-block;margin-bottom:14px;font-size:.85rem;color:var(--verde2);font-weight:600;text-decoration:underline}

/* ── AÇÕES ── */
.acoes{display:flex;gap:10px;margin-top:4px}
.btn-apr{flex:1;background:var(--sucesso);color:#fff;border:none;border-radius:8px;padding:13px;font-size:.92rem;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-rep{flex:1;background:var(--vermelho);color:#fff;border:none;border-radius:8px;padding:13px;font-size:.92rem;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-apr:hover,.btn-rep:hover{opacity:.88}
.btn-apr:disabled,.btn-rep:disabled{opacity:.5;cursor:default}
.motivo-wrap{display:none;margin-top:10px}
.motivo-wrap textarea{width:100%;border:1.5px solid var(--linha);border-radius:8px;padding:10px;font-family:inherit;font-size:.88rem;resize:vertical;min-height:72px}
.motivo-wrap textarea:focus{outline:none;border-color:var(--vermelho)}
.obs-wrap{display:none;margin-top:10px}
.obs-wrap textarea{width:100%;border:1.5px solid var(--linha);border-radius:8px;padding:10px;font-family:inherit;font-size:.88rem;resize:vertical;min-height:60px}
.obs-wrap textarea:focus{outline:none;border-color:var(--sucesso)}
.btn-conf-rep{width:100%;background:var(--vermelho);color:#fff;border:none;border-radius:8px;padding:11px;font-size:.88rem;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px}
.resultado-card{border-radius:10px;padding:18px;text-align:center;margin-top:8px}
.res-apr{background:var(--sucessob);border:1px solid #bbf7d0}
.res-rep{background:var(--vermelhob);border:1px solid #fecaca}
.res-icon{font-size:2rem;margin-bottom:6px}
.res-titulo{font-size:1rem;font-weight:700;margin-bottom:4px}
.res-sub{font-size:.8rem;color:var(--texto2)}

.empty{text-align:center;padding:40px 20px;color:var(--texto2)}
.empty-icon{font-size:2rem;margin-bottom:10px}
.empty-title{font-size:.95rem;font-weight:600;color:var(--texto);margin-bottom:4px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
</style>
</head>
<body>

<!-- CARREGANDO -->
<div id="tela-loading">
  <div class="loading-wrap">
    <div class="spin-grande"></div>
    <div style="font-size:.9rem">Verificando sessão...</div>
  </div>
</div>

<!-- LOGIN -->
<div id="tela-login" style="display:none">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M9 14l2 2 4-4"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      </div>
      <div>
        <div class="login-titulo">Servir</div>
        <div class="login-sub">Aprovação de Compras</div>
      </div>
    </div>

    <div id="bloco-login-form">
      <div class="campo">
        <label>E-mail</label>
        <input type="email" id="login-email" placeholder="seu@email.com" autocomplete="email">
      </div>
      <div class="campo">
        <label>Senha</label>
        <input type="password" id="login-senha" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')fazerLogin()">
      </div>
      <button class="btn-primary" id="btn-login" onclick="fazerLogin()">Entrar</button>
      <div class="msg-erro" id="login-erro"></div>
      <div style="text-align:center;margin-top:14px">
        <button class="link-sutil" onclick="mostrarRecuperar()">Esqueci minha senha</button>
      </div>
    </div>

    <div id="bloco-recuperar" style="display:none">
      <div style="font-size:.82rem;color:var(--texto2);margin-bottom:10px">Digite seu e-mail e enviaremos um link para redefinir sua senha.</div>
      <input type="email" id="rec-email" placeholder="seu@email.com" style="margin-bottom:8px">
      <button class="btn-primary" onclick="recuperarSenha()">Enviar link de recuperação</button>
      <div id="rec-msg" class="msg-erro"></div>
      <div style="text-align:center;margin-top:10px">
        <button class="link-sutil" onclick="esconderRecuperar()">Voltar ao login</button>
      </div>
    </div>

    <div id="bloco-nova-senha" style="display:none">
      <div style="font-size:.9rem;font-weight:600;color:var(--verde);margin-bottom:10px">🔐 Definir nova senha</div>
      <div class="campo">
        <label>Nova senha</label>
        <input type="password" id="nova-senha" placeholder="Mínimo 6 caracteres">
      </div>
      <button class="btn-primary" onclick="salvarNovaSenha()">Salvar nova senha</button>
      <div id="nova-senha-msg" class="msg-erro"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="tela-app">
  <header>
    <div class="header-esq">
      <div class="header-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M9 14l2 2 4-4"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      </div>
      <div>
        <div class="header-titulo">Aprovação de Compras</div>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="header-sub" id="header-usuario"></div>
          <button title="Encerrar sessão" onclick="confirmarSair()" style="background:none;border:none;cursor:pointer;color:rgba(255,255,255,.55);padding:0;display:flex;align-items:center;line-height:1">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- LISTA -->
  <div id="tela-lista">
    <div class="abas">
      <button class="aba on" onclick="mudarAba('pendente',this)">⏳ Pendentes <span class="badge" id="badge-pendente">0</span></button>
      <button class="aba" onclick="mudarAba('aprovada',this)">✅ Aprovadas <span class="badge" id="badge-aprovada">0</span></button>
      <button class="aba" onclick="mudarAba('reprovada',this)">❌ Reprovadas <span class="badge" id="badge-reprovada">0</span></button>
    </div>
    <main id="main-lista">
      <div class="empty"><div class="empty-icon">⏳</div><div class="empty-title">Carregando...</div></div>
    </main>
  </div>

  <!-- DETALHE -->
  <div id="tela-detalhe">
    <main>
      <button class="back-btn" onclick="voltarLista()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Voltar à lista
      </button>
      <div id="detalhe-conteudo"></div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://frzvcrcshkpvjdbbqkhz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_h-JuDyjYgb5YKGYFRKtLEg_8gnJor9w';
const ID_URL = new URLSearchParams(window.location.search).get('solicitacao') || '';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let abaAtual = 'pendente';
let todasSolicitacoes = [];
let unidadesQueAprovo = [];

const statusLabel = { pendente:{cls:'sp',txt:'⏳ Pendente'}, aprovada:{cls:'sa',txt:'✅ Aprovada'}, reprovada:{cls:'sr',txt:'❌ Reprovada'} };
const formaAquisicaoLabel = { cotacao_local: 'Cotação local', compra_online: 'Compra pela internet', fornecedor_recorrente: 'Fornecedor recorrente' };

function formatarMoeda(v){ return v != null ? 'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2}) : '—'; }

// ── Login ─────────────────────────────────────────────
async function fazerLogin(){
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  const erroEl = document.getElementById('login-erro');
  const btn = document.getElementById('btn-login');
  erroEl.textContent = '';
  if(!email || !senha){ erroEl.textContent = 'Preencha email e senha.'; return; }
  btn.innerHTML = '<span class="spin"></span>'; btn.disabled = true;
  const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
  btn.innerHTML = 'Entrar'; btn.disabled = false;
  if(error){
    erroEl.textContent = error.message === 'Invalid login credentials' ? 'Email ou senha incorretos.' : error.message;
    return;
  }
  iniciarApp(data.user);
}

function mostrarRecuperar(){
  document.getElementById('bloco-login-form').style.display = 'none';
  document.getElementById('bloco-recuperar').style.display = 'block';
  const email = document.getElementById('login-email').value.trim();
  if(email) document.getElementById('rec-email').value = email;
}
function esconderRecuperar(){
  document.getElementById('bloco-recuperar').style.display = 'none';
  document.getElementById('bloco-login-form').style.display = 'block';
  document.getElementById('rec-msg').textContent = '';
}
async function recuperarSenha(){
  const email = document.getElementById('rec-email').value.trim();
  const msgEl = document.getElementById('rec-msg');
  msgEl.textContent = ''; msgEl.className = 'msg-erro';
  if(!email){ msgEl.textContent = 'Informe o e-mail.'; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href.split('?')[0] });
  if(error){ msgEl.textContent = 'Erro: ' + error.message; }
  else{ msgEl.textContent = '✓ Link enviado! Verifique seu e-mail.'; msgEl.className = 'msg-ok'; }
}

const hashParams = new URLSearchParams(window.location.hash.replace('#',''));
const isRecuperacao = hashParams.get('type') === 'recovery';
function mostrarNovaSenha(){
  document.getElementById('tela-loading').style.display = 'none';
  document.getElementById('tela-login').style.display = 'flex';
  document.getElementById('bloco-login-form').style.display = 'none';
  document.getElementById('bloco-recuperar').style.display = 'none';
  document.getElementById('bloco-nova-senha').style.display = 'block';
}
async function salvarNovaSenha(){
  const senha = document.getElementById('nova-senha').value;
  const msgEl = document.getElementById('nova-senha-msg');
  msgEl.textContent = ''; msgEl.className = 'msg-erro';
  if(!senha || senha.length < 6){ msgEl.textContent = 'Mínimo 6 caracteres.'; return; }
  const { error } = await sb.auth.updateUser({ password: senha });
  if(error){ msgEl.textContent = 'Erro: ' + error.message; }
  else{
    msgEl.textContent = '✓ Senha atualizada! Redirecionando...'; msgEl.className = 'msg-ok';
    setTimeout(() => { window.location.href = window.location.pathname; }, 1800);
  }
}

async function confirmarSair(){ if(confirm('Deseja encerrar sua sessão?')) await sair(); }
async function sair(){
  await sb.auth.signOut();
  location.reload();
}

// ── Inicia o app ──────────────────────────────────────
async function iniciarApp(user){
  document.getElementById('tela-loading').style.display = 'none';
  document.getElementById('tela-login').style.display = 'none';
  document.getElementById('tela-app').style.display = 'block';
  document.getElementById('header-usuario').textContent = user.user_metadata?.nome || user.user_metadata?.full_name || user.email;

  const { data: aprov, error } = await sb
    .from('compras_aprovadores')
    .select('unidade_negocio_id')
    .eq('user_id', user.id)
    .eq('ativo', true);

  if(error || !aprov || !aprov.length){
    document.getElementById('main-lista').innerHTML = '<div class="empty"><div class="empty-icon">🔒</div><div class="empty-title">Você não é aprovador de nenhuma unidade ainda.</div></div>';
    return;
  }
  unidadesQueAprovo = aprov.map(a => a.unidade_negocio_id);

  if(ID_URL){ await abrirDetalhe(ID_URL); }
  else{ await carregarLista(); }
}

// ── Lista ─────────────────────────────────────────────
async function carregarLista(){
  const main = document.getElementById('main-lista');
  main.innerHTML = '<div class="empty"><div class="empty-icon">⏳</div><div class="empty-title">Carregando...</div></div>';
  const { data, error } = await sb
    .from('compras_solicitacoes')
    .select('*, servir_unidades_negocio ( nome )')
    .in('unidade_negocio_id', unidadesQueAprovo)
    .in('status', ['pendente', 'aprovada', 'reprovada'])
    .order('urgente', { ascending: false })
    .order('created_at', { ascending: false });
  if(error){ main.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Erro ao carregar</div></div>'; return; }
  todasSolicitacoes = data || [];
  atualizarBadges();
  renderLista();
}

function atualizarBadges(){
  ['pendente','aprovada','reprovada'].forEach(st => {
    document.getElementById('badge-'+st).textContent = todasSolicitacoes.filter(s => s.status === st).length;
  });
}

function mudarAba(status, btn){
  document.querySelectorAll('.aba').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  abaAtual = status;
  renderLista();
}

function renderLista(){
  const main = document.getElementById('main-lista');
  const filtradas = todasSolicitacoes.filter(s => s.status === abaAtual);
  const msgs = { pendente:'Nenhuma solicitação aguardando aprovação', aprovada:'Nenhuma solicitação aprovada', reprovada:'Nenhuma solicitação reprovada' };
  const icons = { pendente:'⏳', aprovada:'✅', reprovada:'❌' };
  if(!filtradas.length){
    main.innerHTML = `<div class="empty"><div class="empty-icon">${icons[abaAtual]}</div><div class="empty-title">${msgs[abaAtual]}</div></div>`;
    return;
  }
  main.innerHTML = filtradas.map(s => `
    <div class="sol-card ${s.urgente ? 'urgente' : ''}" onclick="abrirDetalhe('${s.id}')">
      <div class="sol-card-header">
        <div style="flex:1;min-width:0">
          <div class="sol-num">Nº ${s.numero}${s.urgente ? '<span class="tag-urgente">⚡ Urgente</span>' : ''}</div>
          <div class="sol-desc">${s.descricao_necessidade.slice(0,70)}${s.descricao_necessidade.length>70?'…':''}</div>
          <div class="sol-meta">${s.servir_unidades_negocio?.nome || ''} · ${s.solicitante}${s.setor ? ' · '+s.setor : ''}</div>
          <span class="status-badge ${statusLabel[s.status].cls}">${statusLabel[s.status].txt}</span>
        </div>
        <div style="flex-shrink:0;text-align:right">
          <div class="sol-valor">${formatarMoeda(s.valor_aprovado != null ? s.valor_aprovado : s.valor_estimado)}</div>
          <div class="sol-data">${new Date(s.created_at).toLocaleDateString('pt-BR')}</div>
        </div>
      </div>
    </div>`).join('');
}

function voltarLista(){
  document.getElementById('tela-lista').style.display = 'block';
  document.getElementById('tela-detalhe').style.display = 'none';
  carregarLista();
}

// ── Detalhe ───────────────────────────────────────────
async function abrirDetalhe(id){
  document.getElementById('tela-lista').style.display = 'none';
  document.getElementById('tela-detalhe').style.display = 'block';
  const det = document.getElementById('detalhe-conteudo');
  det.innerHTML = '<div class="empty"><div class="empty-icon">⏳</div><div class="empty-title">Carregando...</div></div>';

  const { data: s, error } = await sb.from('compras_solicitacoes').select('*, servir_unidades_negocio ( nome )').eq('id', id).single();
  if(error || !s){ det.innerHTML = '<div class="empty"><div class="empty-icon">❌</div><div class="empty-title">Solicitação não encontrada ou sem permissão de acesso.</div></div>'; return; }
  const { data: itens } = await sb.from('compras_itens').select('*').eq('solicitacao_id', id).order('created_at', { ascending: true });

  renderDetalhe(s, itens || []);
}

function renderDetalhe(s, itens){
  const det = document.getElementById('detalhe-conteudo');
  const st = statusLabel[s.status] || statusLabel.pendente;

  let prodHTML = '';
  if(itens.length){
    const totalItens = itens.reduce((acc,i) => acc + (Number(i.subtotal)||0), 0);
    prodHTML = `<hr class="div">
    <table class="prod-tab">
      <thead><tr><th>Item</th><th class="r">Qtd</th><th class="r">Unit.</th><th class="r">Subtotal</th></tr></thead>
      <tbody>${itens.map(i=>`<tr><td>${i.item}</td><td class="r">${i.quantidade}</td><td class="r">${formatarMoeda(i.valor_unitario)}</td><td class="r">${formatarMoeda(i.subtotal)}</td></tr>`).join('')}</tbody>
    </table>`;
  }

  let acaoHTML = '';
  if(s.status !== 'pendente'){
    const cor = s.status === 'aprovada' ? 'apr' : 'rep';
    acaoHTML = `<div class="resultado-card res-${cor}">
      <div class="res-icon">${s.status==='aprovada'?'✅':'❌'}</div>
      <div class="res-titulo">${s.status==='aprovada'?'Solicitação Aprovada':'Solicitação Reprovada'}</div>
      <div class="res-sub">${s.aprovado_em ? 'Respondido em '+new Date(s.aprovado_em).toLocaleString('pt-BR') : ''}</div>
      ${s.observacao_aprovacao?`<div style="margin-top:8px;font-size:.82rem;font-style:italic;color:var(--texto2)">"${s.observacao_aprovacao}"</div>`:''}
    </div>
    <button onclick="retornarPendente('${s.id}')"
      style="width:100%;margin-top:10px;background:none;border:1px solid var(--amarelo-forte);border-radius:8px;padding:10px;font-size:.85rem;font-weight:600;color:var(--amarelo);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
      Retornar para Pendente
    </button>`;
  } else {
    acaoHTML = `<div class="acoes">
      <button class="btn-apr" id="btn-apr" onclick="mostrarObs()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        Aprovar
      </button>
      <button class="btn-rep" id="btn-rep" onclick="mostrarMotivo()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Reprovar
      </button>
    </div>
    <div class="obs-wrap" id="obs-wrap">
      <div style="font-size:.75rem;color:var(--sucesso);font-weight:600;margin-bottom:5px">Observação (opcional)</div>
      <textarea id="obs-txt" placeholder="Deixe uma observação sobre a aprovação..."></textarea>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn-apr" style="flex:1;padding:10px" onclick="responder('${s.id}','aprovada')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          Confirmar aprovação
        </button>
        <button onclick="esconderObs()" style="background:none;border:1px solid var(--linha);border-radius:8px;padding:0 14px;cursor:pointer;font-family:inherit;color:var(--texto2);font-size:.85rem">Cancelar</button>
      </div>
    </div>
    <div class="motivo-wrap" id="motivo-wrap">
      <div style="font-size:.75rem;color:var(--vermelho);font-weight:600;margin-bottom:5px">Motivo da reprovação (opcional)</div>
      <textarea id="motivo-txt" placeholder="Descreva o motivo da reprovação..."></textarea>
      <button class="btn-conf-rep" onclick="responder('${s.id}','reprovada')">Confirmar reprovação</button>
    </div>`;
  }

  det.innerHTML = `<div class="det-card">
    <div class="det-header">
      <div><div class="det-numero">Solicitação Nº ${s.numero}${s.urgente ? ' ⚡' : ''}</div><div class="det-data">${s.servir_unidades_negocio?.nome || ''} · ${new Date(s.created_at).toLocaleDateString('pt-BR')}</div></div>
      <span class="status-badge ${st.cls}">${st.txt}</span>
    </div>
    <div class="det-body">
      <div class="det-linha">
        <div class="det-campo"><label>Solicitante</label><div class="val">${s.solicitante}</div></div>
        <div class="det-campo"><label>Setor</label><div class="val">${s.setor || '—'}</div></div>
      </div>
      ${s.veiculo_placa ? `<div class="det-campo" style="margin-bottom:12px"><label>Veículo</label><div class="val">${s.veiculo_placa}</div></div>` : ''}
      <div class="det-campo" style="margin-bottom:12px"><label>Descrição da necessidade</label><div class="val">${s.descricao_necessidade}</div></div>
      ${s.justificativa ? `<div class="det-campo" style="margin-bottom:12px"><label>Justificativa</label><div class="val">${s.justificativa}</div></div>` : ''}
      <div class="det-linha">
        <div class="det-campo"><label>Forma de aquisição</label><div class="val">${formaAquisicaoLabel[s.forma_aquisicao] || '—'}</div></div>
        <div class="det-campo"><label>Fornecedor sugerido</label><div class="val">${s.fornecedor_sugerido || '—'}</div></div>
      </div>
      ${s.anexo_cotacao_url ? `<a class="link-anexo" href="${s.anexo_cotacao_url}" target="_blank" rel="noopener">📎 Ver anexo da cotação</a>` : ''}
      ${prodHTML}
      <div class="total-row"><span class="total-label">Valor estimado</span><span class="total-valor">${formatarMoeda(s.valor_estimado)}</span></div>
      ${acaoHTML}
    </div>
  </div>`;
}

function mostrarObs(){
  document.getElementById('motivo-wrap').style.display = 'none';
  document.getElementById('obs-wrap').style.display = 'block';
  document.getElementById('obs-txt').focus();
}
function esconderObs(){ document.getElementById('obs-wrap').style.display = 'none'; }
function mostrarMotivo(){
  document.getElementById('obs-wrap').style.display = 'none';
  document.getElementById('motivo-wrap').style.display = 'block';
  document.getElementById('motivo-txt').focus();
}

async function responder(id, status){
  const observacao = status === 'aprovada'
    ? (document.getElementById('obs-txt')?.value.trim() || null)
    : (document.getElementById('motivo-txt')?.value.trim() || null);
  const btnA = document.getElementById('btn-apr');
  const btnR = document.getElementById('btn-rep');
  if(btnA) btnA.disabled = true;
  if(btnR) btnR.disabled = true;

  const { error } = await sb.rpc('fn_aprovar_solicitacao_compra', {
    p_solicitacao_id: id, p_status: status, p_observacao: observacao
  });

  if(!error){ await abrirDetalhe(id); }
  else{
    alert(error.message || 'Erro ao registrar resposta.');
    if(btnA) btnA.disabled = false;
    if(btnR) btnR.disabled = false;
  }
}

async function retornarPendente(id){
  if(!confirm('Retornar esta solicitação para "Pendente"?')) return;
  const { error } = await sb.rpc('fn_aprovar_solicitacao_compra', { p_solicitacao_id: id, p_status: 'pendente' });
  if(!error){ await abrirDetalhe(id); }
  else alert(error.message || 'Erro ao retornar para pendente.');
}

// ── Init ──────────────────────────────────────────────
sb.auth.onAuthStateChange((event, session) => {
  if(event === 'PASSWORD_RECOVERY' || isRecuperacao){ mostrarNovaSenha(); return; }
  if(session?.user){ iniciarApp(session.user); }
  else if(event === 'SIGNED_OUT' || (event === 'INITIAL_SESSION' && !session)){
    document.getElementById('tela-loading').style.display = 'none';
    document.getElementById('tela-login').style.display = 'flex';
    setTimeout(() => document.getElementById('login-email').focus(), 100);
  }
});
</script>
</body>
</html>
