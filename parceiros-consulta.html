<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Minhas indicações</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' rx='46' fill='%231B4332'/%3E%3Ccircle cx='72' cy='72' r='24' fill='%23F0F4EE'/%3E%3Ccircle cx='132' cy='72' r='24' fill='%23F2A93B'/%3E%3Cpath d='M26 158c4-32 24-46 46-46s42 14 46 46zM86 158c4-32 24-46 46-46s42 14 46 46z' fill='%23F0F4EE' opacity='.92'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F7F9; --surface:#FFFFFF; --border:#E8EAED; --ink:#171E1A;
    --muted:#6B7280; --brand:#1B4332; --brand-2:#2D6A4F; --brand-soft:#EAF2EE;
    --accent:#F2A93B; --accent-ink:#8A5E12; --danger:#C0392B; --danger-soft:#FBEAE8; --aviso-soft:#FEF3D8;
    --shadow-lg: 0 24px 48px -16px rgba(23,30,26,.22);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter', -apple-system, sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased; }

  .topo{ background:linear-gradient(155deg, var(--brand) 0%, var(--brand-escuro, #143327) 100%); color:#fff; padding:36px 20px 86px; text-align:center; position:relative; overflow:hidden; background-size:cover; background-position:center; }
  .topo::after{ content:""; position:absolute; inset:0; background:radial-gradient(circle at 80% 0%, rgba(242,169,59,.2), transparent 55%); }
  .topo-conteudo{ position:relative; z-index:1; max-width:560px; margin:0 auto; }
  .topo .marca{ font-weight:700; font-size:.95rem; opacity:.9; margin-bottom:12px; }
  .topo h1{ font-size:1.5rem; font-weight:800; letter-spacing:-.02em; }
  .topo p{ font-size:.88rem; color:rgba(255,255,255,.85); margin-top:6px; }

  .container{ max-width:560px; margin:-56px auto 50px; padding:0 16px; position:relative; z-index:2; }
  .card{ background:var(--surface); border-radius:16px; box-shadow:var(--shadow-lg); padding:22px 20px; margin-bottom:16px; }
  .card h2{ font-size:.95rem; font-weight:700; margin-bottom:12px; }
  .saldo-rotulo{ font-size:.8rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .saldo-valor{ font-size:2.2rem; font-weight:800; letter-spacing:-.03em; margin:4px 0 6px; font-variant-numeric:tabular-nums; color:var(--brand); }
  .saldo-valor.negativo{ color:var(--danger); }
  .saldo-nota{ font-size:.82rem; color:var(--muted); line-height:1.45; }
  .codigo-box{ margin-top:14px; background:var(--brand-soft); border-radius:12px; padding:12px 14px; font-size:.85rem; line-height:1.45; }
  .codigo-box strong{ font-size:1.05rem; }

  .item{ padding:11px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; gap:12px; align-items:flex-start; font-size:.88rem; }
  .item:last-child{ border-bottom:none; padding-bottom:0; }
  .item:first-of-type{ padding-top:0; }
  .item .t{ font-weight:600; }
  .item .s{ font-size:.76rem; color:var(--muted); margin-top:2px; line-height:1.4; }
  .item .v{ font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; text-align:right; }
  .pos{ color:var(--brand-2); } .neg{ color:var(--danger); }
  .vazio{ text-align:center; padding:14px 0 4px; color:var(--muted); font-size:.86rem; }
  .pill{ display:inline-block; padding:2px 9px; border-radius:20px; font-size:.66rem; font-weight:700; text-transform:uppercase; vertical-align:middle; margin-left:4px; }
  .pill-indicado{ background:var(--aviso-soft); color:var(--accent-ink); }
  .pill-contratado{ background:#E4EEFB; color:#1F4E8C; }
  .pill-concluido, .pill-confirmada{ background:#E8F3EC; color:var(--brand-2); }
  .pill-cancelado, .pill-cancelada{ background:#EEF0F1; color:var(--muted); }
  .btn-zap{ display:inline-block; margin-top:6px; background:#E3F6EA; color:#1E7A43; border-radius:8px; padding:5px 10px; font-size:.76rem; font-weight:700; text-decoration:none; }
  .btn-atualizar{ display:block; margin:0 auto; background:none; border:1.5px solid var(--border); color:var(--muted); border-radius:9px; padding:9px 18px; font-size:.82rem; font-weight:600; cursor:pointer; font-family:inherit; }
  .central{ text-align:center; padding:30px 10px; }
  .central .icone{ font-size:2.6rem; margin-bottom:14px; }
  .central h2{ font-size:1.2rem; font-weight:700; margin-bottom:8px; }
  .central p{ font-size:.9rem; color:var(--muted); line-height:1.5; }
  .spinner{ width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--brand); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 14px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
  <div class="topo">
    <div class="topo-conteudo">
      <div class="marca" id="marcaTopo">Parceiros</div>
      <h1 id="tituloTopo">Minhas indicações</h1>
      <p id="subtituloTopo"></p>
    </div>
  </div>
  <div class="container" id="conteudo">
    <div class="card"><div class="central"><div class="spinner"></div><p>Carregando...</p></div></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://frzvcrcshkpvjdbbqkhz.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_h-JuDyjYgb5YKGYFRKtLEg_8gnJor9w';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });
  const token = new URLSearchParams(window.location.search).get('t');
  const conteudo = document.getElementById('conteudo');

  const STATUS_SERVICO = { indicado: 'Indicado', contratado: 'Contratado', concluido: 'Concluído', cancelado: 'Cancelado' };
  const TIPO_LANC = { credito: 'Crédito', pagamento: 'Pagamento', resgate: 'Resgate', estorno: 'Estorno', ajuste: 'Ajuste' };

  function escapeHtml(t){ const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
  const moeda = (v) => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  function data(iso){ const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; }
  function linkZap(tel){
    let d = String(tel || '').replace(/\D/g, '');
    if(d.length < 10) return null;
    if(d.length <= 11) d = '55' + d;
    return `https://wa.me/${d}`;
  }

  function clarearCor(hex, p){ hex = (hex || '').replace('#', ''); if(hex.length !== 6) return hex; const c = [0, 2, 4].map(i => parseInt(hex.substr(i, 2), 16)); return '#' + c.map(v => Math.round(v + (255 - v) * p).toString(16).padStart(2, '0')).join(''); }
  function escurecerCor(hex, p){ hex = (hex || '').replace('#', ''); if(hex.length !== 6) return hex; const c = [0, 2, 4].map(i => parseInt(hex.substr(i, 2), 16)); return '#' + c.map(v => Math.round(v * (1 - p)).toString(16).padStart(2, '0')).join(''); }
  function aplicarPersonalizacao(cor, imagem){
    if(/^#[0-9a-fA-F]{6}$/.test(cor || '')){
      const raiz = document.documentElement.style;
      raiz.setProperty('--brand', cor); raiz.setProperty('--brand-2', clarearCor(cor, 0.2));
      raiz.setProperty('--brand-soft', clarearCor(cor, 0.92)); raiz.setProperty('--brand-escuro', escurecerCor(cor, 0.35));
    }
    if(imagem && /^https:\/\//.test(imagem)){
      document.querySelector('.topo').style.backgroundImage = `linear-gradient(155deg, rgba(15,43,34,.72) 0%, rgba(15,43,34,.55) 100%), url('${encodeURI(imagem).replace(/'/g, '%27')}')`;
    }
  }

  function mostrarMensagem(icone, titulo, texto){
    conteudo.innerHTML = `<div class="card"><div class="central"><div class="icone">${icone}</div><h2>${escapeHtml(titulo)}</h2><p>${escapeHtml(texto)}</p></div></div>`;
  }

  function render(d){
    const p = d.parceiro, ehCom = p.tipo_recompensa === 'comissao';
    document.title = `Minhas indicações — ${d.unidade?.nome || ''}`;
    document.getElementById('marcaTopo').textContent = d.unidade?.nome || 'Parceiros';
    document.getElementById('tituloTopo').textContent = `Olá, ${String(p.nome || '').trim().split(/\s+/)[0]}!`;
    document.getElementById('subtituloTopo').textContent = [p.empresa, p.ramo].filter(Boolean).join(' · ');
    aplicarPersonalizacao(d.unidade?.cor_principal, d.unidade?.imagem_fundo_url);
    const saldo = Number(d.saldo) || 0;

    const lancs = (d.lancamentos || []).map(l => `
      <div class="item"><div><div class="t">${escapeHtml(TIPO_LANC[l.tipo] || l.tipo)}</div><div class="s">${escapeHtml(l.descricao || '')} · ${data(l.criado_em)}</div></div>
      <div class="v ${Number(l.valor) < 0 ? 'neg' : 'pos'}">${moeda(l.valor)}</div></div>`).join('') || '<div class="vazio">Nenhum lançamento ainda.</div>';

    const vendas = (d.vendas || []).map(v => `
      <div class="item"><div><div class="t">${escapeHtml(v.cliente_nome || 'Cliente')} <span class="pill pill-${escapeHtml(v.status)}">${v.status === 'cancelada' ? 'Cancelada' : 'Confirmada'}</span></div>
      <div class="s">${data(v.data_venda)} · venda de ${moeda(v.valor_venda)}</div></div>
      <div class="v">${moeda(v.valor_recompensa)}</div></div>`).join('') || '<div class="vazio">Nenhuma venda indicada ainda.</div>';

    const servicos = (d.servicos || []).map(s => {
      const zap = linkZap(s.cliente_contato);
      return `<div class="item"><div style="min-width:0;"><div class="t">${escapeHtml(s.cliente_nome)} <span class="pill pill-${escapeHtml(s.status)}">${escapeHtml(STATUS_SERVICO[s.status] || s.status)}</span></div>
        <div class="s">${escapeHtml(s.descricao_servico)} · indicado em ${data(s.criado_em)}</div>
        ${s.cliente_contato ? `<div class="s">Contato: ${escapeHtml(s.cliente_contato)}</div>` : ''}
        ${zap ? `<a class="btn-zap" href="${zap}" target="_blank" rel="noopener">Chamar no WhatsApp</a>` : ''}</div></div>`;
    }).join('') || '<div class="vazio">Nenhum serviço indicado ainda.</div>';

    conteudo.innerHTML = `
      <div class="card">
        <div class="saldo-rotulo">${ehCom ? 'Comissão a receber' : 'Cashback disponível'}</div>
        <div class="saldo-valor ${saldo < 0 ? 'negativo' : ''}">${moeda(saldo)}</div>
        <div class="saldo-nota">${ehCom ? 'Você recebe' : 'Você ganha'} <strong>${Number(p.percentual) || 0}%</strong> sobre as vendas que indicar. ${ehCom ? 'A loja acerta o valor com você em dinheiro.' : 'O crédito pode ser usado em compras na loja.'}</div>
        <div class="codigo-box">Seu código de parceiro: <strong>#${escapeHtml(p.codigo)}</strong><br>Cite esse código (ou seu nome) no balcão quando indicar um cliente.</div>
      </div>
      <div class="card"><h2>Serviços que a loja indicou pra você</h2>${servicos}</div>
      <div class="card"><h2>Vendas que você indicou</h2>${vendas}</div>
      <div class="card"><h2>Extrato</h2>${lancs}</div>
      <button class="btn-atualizar" id="btnAtualizar">↻ Atualizar</button>`;
    document.getElementById('btnAtualizar').addEventListener('click', carregar);
  }

  async function carregar(){
    if(!token || token.length < 32){ mostrarMensagem('⚠️', 'Link incompleto', 'O link usado está incompleto. Peça seu link pessoal na loja.'); return; }
    const { data: d, error } = await sb.rpc('parceiros_consulta', { p_token: token });
    if(error){ mostrarMensagem('⚠️', 'Não foi possível carregar', 'Tente de novo em instantes.'); return; }
    if(!d || !d.ok){ mostrarMensagem('🔒', 'Link inválido ou desativado', 'Esse link não existe mais ou foi trocado. Peça um link novo na loja.'); return; }
    render(d);
  }

  sb.auth.signOut().finally(carregar);
</script>
</body>
</html>
