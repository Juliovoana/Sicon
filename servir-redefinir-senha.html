<title>Servir — Redefinir senha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F7F9; --surface:#FFFFFF; --border:#E8EAED; --ink:#171E1A; --muted:#6B7280;
    --brand:#1B4332; --brand-2:#2D6A4F; --brand-soft:#EAF2EE;
    --danger:#C0392B; --danger-soft:#FBEAE8; --success-soft:#E8F3EC;
    --shadow-lg: 0 24px 48px -16px rgba(23,30,26,.22);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh; font-family:'Inter', -apple-system, sans-serif; color:var(--ink);
    background:linear-gradient(155deg, var(--brand) 0%, #143327 100%);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{ width:100%; max-width:380px; background:var(--surface); border-radius:16px; padding:32px 28px; box-shadow:var(--shadow-lg); }
  .marca{ display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .marca-nome{ font-size:1.15rem; font-weight:700; color:var(--brand); }
  .marca-sub{ font-size:.8rem; color:var(--muted); margin-top:1px; }
  h1{ font-size:1.05rem; font-weight:700; margin-bottom:4px; }
  p.sub{ font-size:.84rem; color:var(--muted); margin-bottom:20px; line-height:1.5; }
  label{ display:block; font-size:.78rem; font-weight:600; color:var(--ink); margin-bottom:6px; margin-top:14px; }
  label:first-of-type{ margin-top:0; }
  .wrap{ position:relative; }
  .wrap input{ padding-right:42px; }
  input{
    width:100%; border:1.5px solid var(--border); border-radius:10px; padding:11px 14px;
    font-size:.92rem; font-family:inherit; color:var(--ink); outline:none; transition:border-color .15s, box-shadow .15s;
  }
  input:focus{ border-color:var(--brand-2); box-shadow:0 0 0 3px var(--brand-soft); }
  .olho{ position:absolute; top:50%; right:8px; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--muted); display:flex; padding:4px; }
  .olho svg{ width:18px; height:18px; }
  .btn{
    width:100%; background:var(--brand); color:#fff; border:none; border-radius:10px; padding:12px;
    font-size:.92rem; font-weight:600; cursor:pointer; font-family:inherit; margin-top:20px; transition:background .15s;
  }
  .btn:hover{ background:#143327; }
  .btn:disabled{ opacity:.6; cursor:default; }
  .btn-secundario{
    width:100%; background:none; border:1.5px solid var(--border); color:var(--muted);
    border-radius:10px; padding:11px; font-size:.85rem; font-weight:600; cursor:pointer; font-family:inherit;
    margin-top:10px; text-decoration:none; display:block; text-align:center;
  }
  .msg{ font-size:.82rem; margin-top:10px; min-height:1.1em; }
  .msg.erro{ color:var(--danger); }
  .msg.ok{ color:var(--brand-2); }
  .spin{ display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .6s linear infinite; }
  .spin-grande{ width:30px; height:30px; border:3px solid var(--border); border-top-color:var(--brand); border-radius:50%; animation:spin .7s linear infinite; margin:0 auto 14px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .central{ text-align:center; padding:8px 0; color:var(--muted); font-size:.88rem; }
  .icone-status{ font-size:2.2rem; margin-bottom:10px; }
  .titulo-status{ font-size:1rem; font-weight:700; color:var(--ink); margin-bottom:6px; }
  .sub-status{ font-size:.84rem; color:var(--muted); margin-bottom:18px; line-height:1.5; }
</style>
</head>
<body>

<div class="card">
  <div class="marca">
    <svg width="32" height="32" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
      <defs>
        <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1B4332"/><stop offset="100%" stop-color="#0F2B22"/></linearGradient>
        <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#E5991F"/><stop offset="100%" stop-color="#F2A93B"/></linearGradient>
      </defs>
      <rect width="200" height="200" rx="46" fill="url(#g1)"/>
      <path d="M 58 152 C 58 128, 96 132, 96 108 C 96 84, 60 88, 60 64 C 60 44, 82 34, 106 34" fill="none" stroke="url(#g2)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="58" cy="152" r="8.5" fill="#F0F4EE"/>
      <path d="M132 20 C145 20 155 30 155 43 C155 58 132 78 132 78 C132 78 109 58 109 43 C109 30 119 20 132 20 Z" fill="#F0F4EE"/>
      <circle cx="132" cy="43" r="9" fill="#1B4332"/>
    </svg>
    <div>
      <div class="marca-nome">Servir</div>
      <div class="marca-sub">Redefinição de senha</div>
    </div>
  </div>

  <div id="conteudo">
    <div class="central">
      <div class="spin-grande"></div>
      Verificando o link…
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  // =================================================================
  // Config do Supabase — mesmo projeto compartilhado por todos os
  // módulos Servir (Locadora, Receptivo, futuros)
  // =================================================================
  const SUPABASE_URL = 'https://frzvcrcshkpvjdbbqkhz.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_h-JuDyjYgb5YKGYFRKtLEg_8gnJor9w';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const conteudo = document.getElementById('conteudo');

  // =================================================================
  // "Voltar pro módulo de origem"
  //
  // Cada painel, ao chamar resetPasswordForEmail, deve mandar:
  //   redirectTo: URL_DESTA_PAGINA + '?voltar=' + encodeURIComponent(window.location.href)
  //
  // O parâmetro fica na query string, então sobrevive ao hash que o
  // Supabase acrescenta com o token de recuperação (#access_token=...).
  // Só aceitamos redirecionar de volta pra URLs do MESMO domínio desta
  // página — evita virar um redirecionador aberto pra qualquer link.
  // =================================================================
  function obterUrlVoltarValidada(){
    const params = new URLSearchParams(window.location.search);
    const bruta = params.get('voltar');
    if(!bruta) return null;
    try{
      const url = new URL(decodeURIComponent(bruta));
      if(url.origin !== window.location.origin) return null;
      return url.href;
    }catch(erro){
      return null;
    }
  }

  function nomeAmigavelModulo(urlVoltar){
    try{
      const arquivo = new URL(urlVoltar).pathname.split('/').pop() || '';
      const base = arquivo.replace(/-painel-admin\.html$/i, '').replace(/\.html$/i, '');
      if(!base) return 'seu painel';
      return base.charAt(0).toUpperCase() + base.slice(1);
    }catch(erro){
      return 'seu painel';
    }
  }

  const urlVoltar = obterUrlVoltarValidada();
  const nomeModulo = urlVoltar ? nomeAmigavelModulo(urlVoltar) : null;

  // =================================================================
  // Telas
  // =================================================================
  function mostrarFormSenha(){
    conteudo.innerHTML = `
      <h1>Definir nova senha</h1>
      <p class="sub">${nomeModulo ? `Você está redefinindo a senha de acesso ao painel <strong>${nomeModulo}</strong>.` : 'Digite e confirme sua nova senha.'}</p>
      <label>Nova senha</label>
      <div class="wrap">
        <input type="password" id="nova-senha" placeholder="Mínimo 6 caracteres" onkeydown="if(event.key==='Enter')document.getElementById('conf-senha').focus()">
        <button class="olho" type="button" onclick="toggleSenha('nova-senha')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <label>Confirmar senha</label>
      <div class="wrap">
        <input type="password" id="conf-senha" placeholder="Repita a nova senha" onkeydown="if(event.key==='Enter')salvar()">
        <button class="olho" type="button" onclick="toggleSenha('conf-senha')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button class="btn" id="btn-salvar" onclick="salvar()">Salvar nova senha</button>
      <div class="msg" id="msg"></div>
    `;
    setTimeout(() => document.getElementById('nova-senha').focus(), 100);
  }

  function mostrarErro(txt){
    conteudo.innerHTML = `
      <div class="central">
        <div class="icone-status">⚠️</div>
        <div class="titulo-status">Link inválido ou expirado</div>
        <div class="sub-status">${txt || 'Solicite um novo link de recuperação no painel de origem.'}</div>
        ${urlVoltar ? `<a class="btn-secundario" href="${urlVoltar}">Voltar para ${nomeModulo}</a>` : ''}
      </div>`;
  }

  function mostrarSucesso(){
    conteudo.innerHTML = `
      <div class="central">
        <div class="icone-status">✅</div>
        <div class="titulo-status">Senha atualizada com sucesso!</div>
        <div class="sub-status">Você já pode entrar${nomeModulo ? ` no painel ${nomeModulo}` : ''} com a nova senha.</div>
        ${urlVoltar
          ? `<a class="btn-secundario" style="background:var(--brand); color:#fff; border:none;" href="${urlVoltar}">Voltar para ${nomeModulo}</a>`
          : `<div class="msg">Feche esta aba e entre novamente no painel.</div>`}
      </div>`;
  }

  function toggleSenha(id){
    const i = document.getElementById(id);
    i.type = i.type === 'password' ? 'text' : 'password';
  }

  async function salvar(){
    const nova = document.getElementById('nova-senha').value;
    const conf = document.getElementById('conf-senha').value;
    const msgEl = document.getElementById('msg');
    const btn = document.getElementById('btn-salvar');
    msgEl.textContent = '';
    msgEl.className = 'msg';

    if(!nova || nova.length < 6){
      msgEl.textContent = 'A senha deve ter pelo menos 6 caracteres.';
      msgEl.classList.add('erro');
      return;
    }
    if(nova !== conf){
      msgEl.textContent = 'As senhas não coincidem.';
      msgEl.classList.add('erro');
      return;
    }

    btn.innerHTML = '<span class="spin"></span>';
    btn.disabled = true;
    const { error } = await sb.auth.updateUser({ password: nova });
    btn.innerHTML = 'Salvar nova senha';
    btn.disabled = false;

    if(error){
      msgEl.textContent = 'Erro: ' + error.message;
      msgEl.classList.add('erro');
      return;
    }

    await sb.auth.signOut();
    mostrarSucesso();
  }

  // =================================================================
  // Detecta a sessão de recuperação vinda do link do e-mail
  // =================================================================
  const hashParams = new URLSearchParams(window.location.hash.replace('#', ''));
  const ehRecuperacao = hashParams.get('type') === 'recovery';

  sb.auth.onAuthStateChange((event, session) => {
    if(event === 'PASSWORD_RECOVERY' || ehRecuperacao){
      mostrarFormSenha();
    } else if(event === 'INITIAL_SESSION' && !session){
      mostrarErro('Este link já foi usado ou expirou.');
    }
  });
</script>
</body>
</html>
